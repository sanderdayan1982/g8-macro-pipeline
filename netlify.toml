# ============================================================================
# Netlify deploy configuration
# G8 Macro Pipeline — Institutional Dashboard
# ============================================================================

[build]
  publish = "docs"
  command = ""
  # Skip the deploy (and its 15 credits) unless the published site changed.
  # Exit 0 = skip build, exit 1 = build. Data/bot commits don't touch docs/;
  # docs/actas/ and docs/*.md are records/docs, not part of the live dashboard.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs ':!docs/actas' ':!docs/*.md' netlify.toml"

# ----------------------------------------------------------------------------
# Headers — security + caching (optimized to save Netlify bandwidth & requests)
# ----------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/proxy/*"
  [headers.values]
    Cache-Control = "public, max-age=900, stale-while-revalidate=3600"
