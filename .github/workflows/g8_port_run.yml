# .github/workflows/g8_port_run.yml
# G8 PORT — pipeline run (D6): Telegram only on change.
# Phase 2: POS only. COT is a WEEKLY release (CFTC 15:30 ET, which is 20:30 UTC in winter
# and 19:30 UTC in summer, report as of Tue) — the 4-hourly cadence belonged to the
# (paused) FFVA generators. Cadence: Fri 21:05 UTC + Sat 09:05 UTC retry, plus
# Mon 21:05 UTC + Tue 09:05 UTC retry for a Monday CFTC release.
# The collector writes nothing unless the report date is new. The weekly metals MDP
# is recomputed only after that new report was written on the Monday or Tuesday pass.
#
# 2026-09-12 — FFVA paused (no Databento spend). 2026-10-16 (A4, plan de armonía): FFVA RETIRADO del
#   dashboard — su dueño único es 9-FFVA en TradingView. Se borran su generador, su twin, su colector de
#   futuros y su workflow de backfill; data/futures/canonical se conserva (usd_factor.py lo lee como twin).
name: G8 Port Run

on:
  schedule:
    - cron: '5 21 * * 5'
    - cron: '5 9 * * 6'
    - cron: '5 21 * * 1'
    - cron: '5 9 * * 2'
  workflow_dispatch:

concurrency:
  group: g8-port-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Private data pull
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_READ_CI }}
        run: |
          set -euo pipefail
          python3 scripts/tools/private_data.py pull "$RUNNER_TEMP/g8data" --rows 6,11,12

      # ── ingest ──────────────────────────────────────────────────────────────
      - name: COT collector (CFTC SODA) v1.0.1
        id: cot
        run: |
          set -o pipefail
          python scripts/pos_g8_cot_collector.py --out data/pos_g8_cot.json | tee "$RUNNER_TEMP/cot.log"
          if grep -q '^COT_RESULT wrote=1 ' "$RUNNER_TEMP/cot.log"; then
            echo "wrote=true" >> "$GITHUB_OUTPUT"
          elif grep -q '^COT_RESULT wrote=0 ' "$RUNNER_TEMP/cot.log"; then
            echo "wrote=false" >> "$GITHUB_OUTPUT"
          else
            echo "collector finished without a COT_RESULT line" >&2
            exit 1
          fi

      # Weekly MDP only. Friday/Saturday and an unchanged report date do not run it,
      # so MFV outputs and generated timestamps stay byte-for-byte as they were.
      - name: Weekly metals MDP only after a new COT on the Monday or Tuesday pass
        id: metals
        timeout-minutes: 22
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          G8_NO_SEND: '1'
          G8_JOB: metals
        run: |
          set -o pipefail
          python scripts/pos_g8_cot_collector.py --metals-after-cot \
            --schedule "${{ github.event.schedule }}" \
            --cot-wrote "${{ steps.cot.outputs.wrote }}" | tee "$RUNNER_TEMP/metals_gate.log"
          if grep -q '^METALS_RESULT recomputed=1$' "$RUNNER_TEMP/metals_gate.log"; then
            echo "recomputed=true" >> "$GITHUB_OUTPUT"
          elif grep -q '^METALS_RESULT recomputed=0$' "$RUNNER_TEMP/metals_gate.log"; then
            echo "recomputed=false" >> "$GITHUB_OUTPUT"
          else
            echo "metals gate finished without a METALS_RESULT line" >&2
            exit 1
          fi

      # ── generators (one per ported Pine script) ─────────────────────────────
      - name: Generator POS
        id: pos
        run: python scripts/generators/pos_g8.py

      # ── twin-test (runs only when the Pine export exists) ───────────────────
      - name: Twin-test POS
        id: twin
        if: hashFiles('data/twin/pos_g8_pine.csv') != ''
        continue-on-error: true
        run: python scripts/twin_test.py POS

      # ── notify only on change (D6) ──────────────────────────────────────────
      - name: Telegram (diff-based)
        run: python scripts/notify_telegram.py --states data/state/pos_g8.json

      # ── refresh §00 brief so the dashboard's "POS twin-test" line picks up the
      #    status this run just wrote to pos_g8_twin.json (audit 2026-09-19: brief.json
      #    was only ever regenerated by the unrelated options/usd_factor/daily-update
      #    workflows, so a fresh twin-test verdict could sit stale on the dashboard
      #    for hours/days until one of those happened to run) ──
      - name: Dashboard alerts (refresh brief.json)
        id: dash
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python scripts/dashboard_alerts.py > "$RUNNER_TEMP/dashboard-alerts.log" 2>&1
          rc=$?
          set -e
          rows=$(wc -l < "$RUNNER_TEMP/dashboard-alerts.log" | tr -d ' ')
          echo "dashboard_alerts rc=${rc} rows=${rows}"
          exit "$rc"

      # ── commit only if something other than timestamps changed ─────────────
      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pos_g8_cot.json data/state/pos_g8.json data/twin/pos_g8_py_history.csv data/twin/pos_g8_twin.json data/alerts/brief.json data/alerts/state.json
          if [ "${{ steps.metals.outputs.recomputed }}" = "true" ]; then
            git add data/MFV_G8_XAU.csv data/MFV_G8_XAG.csv data/MFV_G8_state.json
            git add data/MFV_G8_walkforward_XAU.csv data/MFV_G8_walkforward_XAG.csv
            git add -- data/MFV_G8_XAU_daily_shadow.csv data/MFV_G8_XAG_daily_shadow.csv data/MFV_G8_shadow_state.json || true
            git add data/_ingest/metals_provenance.json 2>/dev/null || true
            git add data/_ingest/latest/actions__job_metals.json 2>/dev/null || true
            git add data/_ingest/health.json 2>/dev/null || true
            git add data/_ingest/not_before/metals.json 2>/dev/null || true
          fi
          if git diff --cached --quiet -I '"generated_at"' -I '"generated_utc"' -I '"run_id"' -I '"commit"' -I '"age_days"' -I '"age_bd"'; then
            echo "no material change — no commit"
            git reset -q
          else
            git commit -m "g8-port: state update $(date -u +%Y-%m-%dT%H:%MZ) [POS]"
            bash scripts/tools/git_push_retry.sh 5   # acta P-11 (helper P-7): the old loop never failed the job
          fi

      - name: Private data push
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_WRITE }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dashboard-alerts.log"
          clone="$RUNNER_TEMP/g8data"
          if [ -f "$log" ] && [ -d "$clone/.git" ]; then
            mkdir -p "$clone/data/alerts"
            cp "$log" "$clone/data/alerts/g8_port_run_alerts.log"
            git -C "$clone" add -- data/alerts/g8_port_run_alerts.log
            if ! git -C "$clone" diff --cached --quiet; then
              git -C "$clone" -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "data: g8_port_run alerts log [skip netlify]"
            fi
          fi
          python3 scripts/tools/private_data.py push "$RUNNER_TEMP/g8data" \
            --rows 11,12 --workflow "g8_port_run" --session "$(date -u +%F)"

      - name: Private data verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 scripts/tools/private_data.py verify "$RUNNER_TEMP/g8data" --rows 11,12
          rc=$?
          echo "private_data verify rc=${rc}"
          # t297u (b): rc≠0 (differ>0 o fallo) queda en data/_ingest/latest/actions__job_verify_g8_port.json,
          # que lee ingest_watch. Se sube aparte (worktree, [skip netlify]); el paso sigue sin tumbar el job.
          python3 scripts/tools/step_alarm.py record private_verify_g8_port "$rc" --detail "private_data verify rc=${rc}"
          python3 scripts/tools/step_alarm.py publish verify_g8_port --only private_verify_g8_port --commit
          exit "$rc"

      # t297u (c): este paso con continue-on-error que falla queda en data/_ingest/latest/actions__job_g8_port_steps.json,
      # que lee ingest_watch (FAILED → aviso). Se sube aparte (worktree, [skip netlify]); no tumba el job.
      - name: Registro de pasos con continue-on-error (alarma ingest_watch)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          OUT_0: ${{ steps.twin.outcome }}
          OUT_1: ${{ steps.dash.outcome }}
        run: python3 scripts/tools/step_alarm.py publish g8_port_steps --outcome "twin_test_pos=$OUT_0" --outcome "dashboard_alerts_g8_port=$OUT_1" --commit

      # ── principle 9: any failure above → Telegram ───────────────────────────
      - name: Alert on failure
        if: failure()
        run: python scripts/notify_telegram.py --fail "cot=${{ steps.cot.outcome }} metals=${{ steps.metals.outcome }} pos=${{ steps.pos.outcome }}"
