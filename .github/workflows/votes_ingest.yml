# FAMILIAS-00 — votes.csv from TradingView alert mail (read-only Gmail).
# 03:00 UTC = 04:00 WAT (first attempt: no MISSING rows; the final pass is still pending).
# 04:20 UTC = 05:20 WAT (final attempt, after the 05:15 WAT / 04:15 UTC cutoff).
# Before writing MISSING the final pass lists every page of the mailbox window,
# so a mail that arrived before the cutoff is not missed. A Gmail failure on
# that pass is still MISSING.
# Tue–Sat covers the previous weekday close. Weekends produce no rows.
# A CME/New York full close stores mail with session_type=HOLIDAY. No mail
# writes nothing and logs CLOSED (RELOJES-01 Anexo 1 A1).
# Orden ORDEN_ENZO_REVISION-TRIPLE-01 bloque 2 (14-nov-2026 19:16 WAT).
# A refresh token alone cannot mint access tokens: the job also needs
# GMAIL_OAUTH_CLIENT_ID and GMAIL_OAUTH_CLIENT_SECRET. Scope gmail.readonly.
name: Votes ingest

on:
  schedule:
    - cron: '0 3 * * 2-6'
    - cron: '20 4 * * 2-6'
  workflow_dispatch:
    inputs:
      session:
        description: 'Session date YYYY-MM-DD (WAT). Empty = previous weekday.'
        required: false
        type: string
      attempt:
        description: 'first = 04:00 WAT (no MISSING). final = 05:20 WAT, after the 05:15 WAT cutoff (write MISSING).'
        required: false
        default: first
        type: choice
        options:
          - first
          - final

permissions:
  contents: write

concurrency:
  group: votes-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest votes
        id: ingest
        continue-on-error: true
        env:
          GMAIL_READONLY_REFRESH_TOKEN: ${{ secrets.GMAIL_READONLY_REFRESH_TOKEN }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          ATTEMPT="${{ github.event.inputs.attempt }}"
          if [ -z "$ATTEMPT" ]; then
            case "${{ github.event.schedule }}" in
              "0 3 * * 2-6") ATTEMPT=first ;;
              "20 4 * * 2-6") ATTEMPT=final ;;
              *) ATTEMPT=final ;;
            esac
          fi
          SESSION="${{ github.event.inputs.session }}"
          ARGS=(--attempt "$ATTEMPT")
          if [ -n "$SESSION" ]; then
            ARGS+=(--session "$SESSION")
          fi
          python scripts/votes_ingest.py "${ARGS[@]}"

      - name: Commit votes
        if: always() && steps.ingest.outcome != 'cancelled'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/votes.csv data/votes_weekly.json
          if [ -f data/_ingest/votes_rejected.jsonl ]; then
            git add data/_ingest/votes_rejected.jsonl
          fi
          if git diff --cached --quiet; then
            echo "No new vote rows."
          else
            git commit -m "data: votes ingest $(date -u +%F) [skip netlify]"
            bash scripts/tools/git_push_retry.sh 5
          fi

      # t297u (c): este paso con continue-on-error que falla queda en data/_ingest/latest/actions__job_votes_steps.json,
      # que lee ingest_watch (FAILED → aviso). Se sube aparte (worktree, [skip netlify]); no tumba el job.
      - name: Registro de pasos con continue-on-error (alarma ingest_watch)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          OUT_0: ${{ steps.ingest.outcome }}
        run: python3 scripts/tools/step_alarm.py publish votes_steps --outcome "votes_ingest=$OUT_0" --commit

      - name: Gmail failure stays loud
        if: steps.ingest.outcome == 'failure'
        run: exit 1
