name: Feed recovery (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/actas/ACTA_RECOVERY_20261004.md', 'docs/actas/ACTA_FREQUENCY_CEILING_20261005.md']
permissions:
  contents: write
concurrency:
  group: g8-shared-data-alerts
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      G8_NO_SEND: '1'
      G8_JOB: recovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main       # acta P-11: tip of main when the job starts, not the SHA frozen while queued
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh official daily feeds
        id: daily
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          G8_STEP_LOG: ${{ runner.temp }}/recovery_daily.jsonl
        run: python scripts/tools/refresh_feeds.py ALL
      - name: Attempt current RBNZ B2 without historical downloads
        id: nzd
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/tools/g8step.py --name recovery_nzd --cap 180 -- python scripts/fetch_nzd_b2.py --no-hist
      - name: Refresh daily NZ linker calculation
        id: nzreal
        continue-on-error: true
        run: python scripts/real_yields_g8.py NZD
      - name: Refresh ECB daily currency observations and existing factor
        id: factor
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python scripts/usd_factor.py
          python3 scripts/tools/strip_usd_factor_public.py  # DATOS-02 C (t319u): antes de cualquier git add
          python scripts/book_risk.py
      - name: Recover latest elapsed CTF session without historical backfill
        id: final
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/tools/finalize_session.py
      - name: Refresh dashboard snapshots (no messaging or delivery-state changes)
        run: |
          python scripts/tools/refresh_brief_snapshot.py
          python scripts/health_monitor.py
      - name: Publish validated outputs and diagnostic state
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          python3 scripts/tools/strip_usd_factor_public.py  # DATOS-02 C: el paso factor es continue-on-error
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: verified feed recovery and dashboard snapshots'
          bash scripts/tools/git_push_retry.sh 5   # acta P-11 (helper P-7)
      # t297u (c): este paso con continue-on-error que falla queda en data/_ingest/latest/actions__job_recovery_steps.json,
      # que lee ingest_watch (FAILED → aviso). Se sube aparte (worktree, [skip netlify]); no tumba el job.
      - name: Registro de pasos con continue-on-error (alarma ingest_watch)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          OUT_0: ${{ steps.daily.outcome }}
          OUT_1: ${{ steps.nzd.outcome }}
          OUT_2: ${{ steps.nzreal.outcome }}
          OUT_3: ${{ steps.factor.outcome }}
          OUT_4: ${{ steps.final.outcome }}
        run: python3 scripts/tools/step_alarm.py publish recovery_steps --outcome "recovery_feeds=$OUT_0" --outcome "recovery_nzd_b2=$OUT_1" --outcome "recovery_nz_linker=$OUT_2" --outcome "recovery_ecb_factor=$OUT_3" --outcome "recovery_ctf=$OUT_4" --commit

      - name: Keep partial recovery visible as failure
        if: always() && (steps.daily.outcome == 'failure' || steps.nzd.outcome == 'failure' || steps.nzreal.outcome == 'failure' || steps.factor.outcome == 'failure' || steps.final.outcome == 'failure')
        run: exit 1
