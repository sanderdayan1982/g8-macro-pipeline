# Institutional repair: classify from trusted base; execute candidate tests without write credentials.
name: Maintenance agent
on:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-agent
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/health_monitor.py --out .agent/health.json
      - id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/tools/maintenance_due.py --manual >> "$GITHUB_OUTPUT"
          else
            python scripts/tools/maintenance_due.py >> "$GITHUB_OUTPUT"
          fi

  agent:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
      claude: ${{ steps.claude.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: base
        run: |
          git config user.name g8-maintenance-agent
          git config user.email g8-maintenance-agent@users.noreply.github.com
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p .agent
      - name: Claude Code (maintenance)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Lee CLAUDE.md y .github/agent/mantenimiento.md. Revisa TODAS las secciones y la frescura real.
            Busca alternativas oficiales equivalentes para cada API rota o feed atrasado. Verifica fuente,
            definición, unidades, fechas, solapamiento e ingestión antes de cambiar nada. No cambies modelos.
            Haz commits locales sin push. Escribe siempre .agent/report.md con evidencia y pendientes.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(python:*),Bash(python3:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git show:*),Bash(gh run list:*),Bash(gh run view:*),Bash(curl:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(wc:*),Bash(date:*),Bash(mkdir:*)"
            --disallowedTools "Bash(git push:*),Bash(gh pr:*),Bash(gh api:*),Bash(gh secret:*),Bash(gh workflow:*)"
      - name: Package work
        if: always()
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          mkdir -p .agent
          if [ -n "$BASE" ] && [ "$(git rev-list --count "$BASE..HEAD")" -gt 0 ]; then
            git bundle create .agent/work.bundle "$BASE..HEAD"
          fi
          [ -f .agent/report.md ] || echo 'ESTADO: FALLO SIN ARREGLO — agente sin informe' > .agent/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-work
          path: |
            .agent/report.md
            .agent/work.bundle
          include-hidden-files: true
          retention-days: 30

  verify:
    needs: agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      smoke: ${{ steps.smoke.outcome }}
      head: ${{ steps.load.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.agent.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Trusted gate and dependencies (before candidate checkout)
        run: |
          cp scripts/tools/agent_gate.py "$RUNNER_TEMP/trusted_gate.py"
          cp scripts/tools/validate_smoke.sh "$RUNNER_TEMP/trusted_smoke.sh"
          pip install -r requirements.txt pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: agent-work
          path: .agent
      - id: load
        run: |
          if [ -f .agent/work.bundle ]; then
            git fetch .agent/work.bundle HEAD:refs/heads/candidate
            git checkout candidate
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - id: gate
        env:
          BASE: ${{ needs.agent.outputs.base }}
        run: |
          set +e
          python "$RUNNER_TEMP/trusted_gate.py" --base "$BASE" > .agent/gate.json
          rc=$?
          set -e
          cat .agent/gate.json
          case $rc in 0) d=AUTO;; 3) d=OWNER;; 4) d=NADA;; *) d=ERROR;; esac
          echo "decision=$d" >> "$GITHUB_OUTPUT"
      - name: Candidate tests — no repository write token, no Telegram or provider secrets
        id: smoke
        if: steps.gate.outputs.decision == 'AUTO'
        continue-on-error: true
        env:
          G8_NO_SEND: '1'
        run: bash scripts/tools/validate_smoke.sh > .agent/smoke.log 2>&1 || { tail -80 .agent/smoke.log; exit 1; }

  publish:
    needs: [agent, verify]
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: agent-work
          path: .agent
        continue-on-error: true
      - name: Publish verified changes (never execute candidate code here)
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ needs.agent.outputs.base }}
          VERIFIED_HEAD: ${{ needs.verify.outputs.head }}
          DECISION: ${{ needs.verify.outputs.decision }}
          SMOKE: ${{ needs.verify.outputs.smoke }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
        run: |
          git config user.name g8-maintenance-agent
          git config user.email g8-maintenance-agent@users.noreply.github.com
          cp scripts/tools/agent_gate.py "$RUNNER_TEMP/trusted_gate.py"
          result=NO_CHANGES
          if [ "$VERIFY_RESULT" = failure ] || [ "$AGENT_RESULT" = failure ]; then result=FAILED; fi
          if [ -f .agent/work.bundle ] && [ -n "$VERIFIED_HEAD" ]; then
            git fetch .agent/work.bundle HEAD:refs/heads/candidate
            test "$(git rev-parse candidate)" = "$VERIFIED_HEAD"
            git checkout candidate
            # Reclassify independently with trusted main code, no imports from candidate.
            set +e
            python "$RUNNER_TEMP/trusted_gate.py" --base "$BASE" > .agent/gate-final.json
            gate_rc=$?
            set -e
            if [ "$DECISION" = AUTO ] && [ "$gate_rc" = 0 ] && [ "$SMOKE" = success ]; then
              git fetch origin main
              # If code changed since BASE, a new verification is needed. Data-only
              # changes may be merged without silently resolving any conflict.
              code_changes=$(git diff --name-only "$BASE" origin/main -- . ':!data/**')
              if [ -z "$code_changes" ] && git merge --no-edit origin/main && git push origin HEAD:main; then
                result=MERGED
              else
                git merge --abort 2>/dev/null || true
                result=REVIEW
              fi
            else
              result=REVIEW
            fi
            if [ "$result" = REVIEW ]; then
              branch="agent/maint-${{ github.run_id }}"
              git push origin "HEAD:refs/heads/$branch"
              [ -f .agent/report.md ] || echo 'Revisar logs: no hay informe.' > .agent/report.md
              gh pr create --base main --head "$branch" --title 'Mantenimiento G8 — revisión requerida' --body-file .agent/report.md
            fi
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          git checkout main
          git pull --ff-only origin main
          # Trusted code from main, not the unmerged candidate, records attempts.
          python scripts/tools/maintenance_due.py --record "$result"
          git add data/_ingest/maintenance_state.json
          git commit -m 'chore: record maintenance attempt'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
          if [ "$result" = MERGED ]; then
            gh workflow run validate.yml --ref main
            gh workflow run daily_update.yml --ref main
          fi
      - name: Report outcome
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ steps.publish.outputs.result }}
          AGENT_RESULT: ${{ needs.agent.outputs.claude }}
        run: |
          git checkout main
          python - <<'PY'
          import html, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import notify_telegram as N
          p = Path('.agent/report.md')
          report = p.read_text()[:2800] if p.exists() else 'Agente sin informe: revisar Actions.'
          message = 'G8 mantenimiento · integración: %s · agente: %s\n%s' % (os.environ['RESULT'], os.environ['AGENT_RESULT'], report)
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(message)
          if not N.send(html.escape(message)):
              raise SystemExit('Aviso de mantenimiento no entregado')
          PY
