# ============================================================================
# CME FX Options Surface — daily collector (Databento GLBX.MDP3, licensed)
# Two windows: 13:30 UTC (data usually ready ~12:30) + 17:00 UTC retry.
# Idempotent via data/options/state.json (availability guard exits clean
# if the session is not yet fully published; catch-up backfills gaps).
# Secret required: DATABENTO_API_KEY  (Settings -> Secrets -> Actions)
# ============================================================================
name: CME Options Surface

on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: {}

# t247u: el token del job no puede hacer push al repo público.
permissions:
  contents: read

concurrency:
  group: cme-options
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      # PR-A: filas 1-3, 6, 11 y 12 desde g8-macro-data. El token solo vive en este paso.
      - name: Private data pull
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_READ_CI }}
        run: |
          set -euo pipefail
          python3 scripts/tools/private_data.py pull "$RUNNER_TEMP/g8data" --rows 1,2,3,6,11,12

      - name: Run collector (availability-guarded, catch-up)
        id: collector
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          G8_OPT_OUT_DIR: data/options/canonical
          G8_OPT_STATE_FILE: data/options/state.json
          G8_OPT_VOL_DIR: data/options/volume_shadow
          # t186u (Sander, 15-nov-2026): compressed original outside the checkout.
          G8_OPT_RAW_DIR: ${{ runner.temp }}/cme-options-raw
        run: |
          set +e
          start=$(date +%s)
          python scripts/cme_options_collector.py > "$RUNNER_TEMP/cme.log" 2>&1
          rc=$?
          set -e
          dur=$(( $(date +%s) - start ))
          rows=$(wc -l < "$RUNNER_TEMP/cme.log" | tr -d ' ')
          echo "cme_options_collector rc=${rc} duration=${dur}s rows=${rows}"
          exit "$rc"

      # orden Sander 18-nov t244u. The gzip stays on the runner. It is not
      # uploaded as an artifact and it is not git-added.

      - name: Build dashboard summary JSON
        id: summary
        env:
          G8_OPT_OUT_DIR: data/options/canonical
          G8_OPT_SUMMARY: data/OPTIONS_SURFACE.json
        run: |
          set +e
          start=$(date +%s)
          python scripts/build_options_summary.py > "$RUNNER_TEMP/cme.log" 2>&1
          rc=$?
          set -e
          dur=$(( $(date +%s) - start ))
          rows=$(wc -l < "$RUNNER_TEMP/cme.log" | tr -d ' ')
          echo "build_options_summary rc=${rc} duration=${dur}s rows=${rows}"
          exit "$rc"

      # t252u: la ejecución normal puede imprimir el cuerpo de opciones
      # (notify_telegram lo escribe si faltan secretos). Esa salida no entra
      # en el log del job: se guarda y el push privado la lleva al clon.
      - name: Dashboard alerts (Telegram on change)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python scripts/dashboard_alerts.py > "$RUNNER_TEMP/cme-alerts.log" 2>&1
          rc=$?
          set -e
          rows=$(wc -l < "$RUNNER_TEMP/cme-alerts.log" | tr -d ' ')
          echo "dashboard_alerts rc=${rc} rows=${rows}"
          exit "$rc"

      # t249u: el commit queda en el clon privado. El push de ese clon es
      # scripts/tools/git_push_retry.sh. Este job no publica en el repo público.
      - name: Private data push
        if: steps.collector.outcome == 'success' && steps.summary.outcome == 'success'
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_WRITE }}
        run: |
          set -euo pipefail
          clone="$RUNNER_TEMP/g8data"
          python3 scripts/tools/private_data.py push "$clone" \
            --rows 1,2,3,6,11,12 \
            --no-push \
            --workflow "cme_options" --session "$(date -u +%F)"
          if [ -f "$RUNNER_TEMP/cme-alerts.log" ]; then
            mkdir -p "$clone/data/alerts"
            cp "$RUNNER_TEMP/cme-alerts.log" "$clone/data/alerts/cme_options_alerts.log"
            git -C "$clone" add -- data/alerts/cme_options_alerts.log
            if ! git -C "$clone" diff --cached --quiet; then
              git -C "$clone" commit -m "data: cme_options alerts log [skip netlify]"
            fi
          fi
          ahead=$(git -C "$clone" rev-list --count origin/main..HEAD)
          if [ "$ahead" = 0 ]; then
            echo "private_data push: no-op"
            exit 0
          fi
          ask="$RUNNER_TEMP/.g8-askpass"
          test -x "$ask"
          git -C "$clone" config --local credential.helper ""
          (
            cd "$GITHUB_WORKSPACE"
            export GIT_DIR="$RUNNER_TEMP/g8data/.git"
            export GIT_WORK_TREE="$RUNNER_TEMP/g8data"
            export GIT_ASKPASS="$ask"
            export SSH_ASKPASS="$ask"
            export GIT_ASKPASS_REQUIRE=force
            export GIT_TERMINAL_PROMPT=0
            export GCM_INTERACTIVE=Never
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=credential.helper
            export GIT_CONFIG_VALUE_0=
            bash scripts/tools/git_push_retry.sh 5
          )

      - name: Private data verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 scripts/tools/private_data.py verify "$RUNNER_TEMP/g8data" --rows 1,2,3,6,11,12
          rc=$?
          echo "private_data verify rc=${rc}"
          exit "$rc"

      # ── Ley 2 (fallos ruidosos): cualquier paso rojo → Telegram, no solo email ──
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --fail "workflow=options run=${{ github.run_number }} — ver Actions"
