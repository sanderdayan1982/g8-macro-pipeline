# ============================================================================
# CME FX Options Surface — daily collector (Databento GLBX.MDP3, licensed)
# Two windows: 13:30 UTC (data usually ready ~12:30) + 17:00 UTC retry.
# Idempotent via data/options/state.json (availability guard exits clean
# if the session is not yet fully published; catch-up backfills gaps).
# Secret required: DATABENTO_API_KEY  (Settings -> Secrets -> Actions)
# ============================================================================
name: CME Options Surface

on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cme-options
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run collector (availability-guarded, catch-up)
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          G8_OPT_OUT_DIR: data/options/canonical
          G8_OPT_STATE_FILE: data/options/state.json
        run: python scripts/cme_options_collector.py

      - name: Build dashboard summary JSON
        env:
          G8_OPT_OUT_DIR: data/options/canonical
          G8_OPT_SUMMARY: data/OPTIONS_SURFACE.json
        run: python scripts/build_options_summary.py

      # §08b Cross Walls v2.0 (acta CW-2, RESEARCH): la lectura manual de los muros
      # escrita como regla (3 muros, % del futuro trimestral, lado del dólar);
      # canonical.csv es el registro del gate CW-2; walls.csv el diagnóstico PIN/THROUGH.
      - name: Cross Walls v2 (walls, USD bias, crosses)
        env:
          G8_OPT_OUT_DIR: data/options/canonical
          G8_SOFR_CSV: data/SOFR.csv
          G8_CW_JSON: data/CROSS_WALLS.json
          G8_CW_CSV: data/cross_walls/canonical.csv
        run: python scripts/cross_walls.py

      - name: Wall behaviour (PIN/THROUGH diagnostics, no vote)
        continue-on-error: true
        run: python scripts/wall_behaviour.py

      - name: Gate CW-2 interim report (RESEARCH — single evaluation at 252 evaluable dates)
        continue-on-error: true
        run: python scripts/gate_cross_walls.py

      # Dashboard alerts (strike walls card on every new session; $0, repo data only)
      - name: Dashboard alerts (Telegram on change)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/dashboard_alerts.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/options data/OPTIONS_SURFACE.json data/CROSS_WALLS.json data/cross_walls data/alerts
          if git diff --cached --quiet; then
            echo "No new session / no alert-state change — nothing to commit."
          else
            git commit -m "chore: options surface update $(date -u +%F)"
            git push
          fi

      # ── Ley 2 (fallos ruidosos): cualquier paso rojo → Telegram, no solo email ──
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --fail "workflow=options run=${{ github.run_number }} — ver Actions"
