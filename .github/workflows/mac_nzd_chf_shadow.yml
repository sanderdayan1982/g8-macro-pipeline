# t402u (26-nov): retirado como escritor automático.
# Causa: cada push de NZD/CHF/TONA republicaba data/argos_rates.json (y sombras CHF)
# a los pocos segundos del [vps-push] de nzd-b2, segunda publicación del mismo feed.
# argos_rates.json: un solo escritor, nzd_b2_daily.refresh_argos_and_drop_mac_latest (VPS).
# TONA.csv y su ingest: un solo escritor, g8-nzd-b2-daily (VPS).
# La sombra CHF (chf_nowcast_shadow) sigue en daily_update.yml; no se dispara aquí.
# Queda workflow_dispatch, sin commit, por si hay que relanzar la sombra a mano.
# No toca data/argos_rates.json.
name: Mac NZD CHF TONA shadow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retired writer
        run: |
          echo "t402u: este workflow ya no publica. argos_rates.json y TONA salen solo del VPS (nzd-b2)."
