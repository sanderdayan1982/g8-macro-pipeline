# Resumable CME FX options backfill (Databento GLBX.MDP3), one calendar month per commit.
# workflow_dispatch only. Nothing runs until this file is on main and Sander starts it.
# Do not add a schedule. test_p12 would then require a Mac dispatch slot.
# Optional input month (YYYY-MM, default empty): process one chunk. Empty keeps the
# 24-chunk loop byte for byte. The value is the env var BACKFILL_MONTH, never
# interpolated in the shell. A value that fails ^[0-9]{4}-[0-9]{2}$ or is absent
# from --list-months stops the job before any Databento call.
#
# mode=full (default) is that loop. mode=volume_only (order t189u, Sander,
# 15-nov-2026; month split t192u, 15-nov-2026) quotes and downloads one calendar
# month at a time (2026-07, 2026-08, …, then the partial month up to the
# exclusive end). Above a cumulative 6.00 USD it downloads nothing further.
# Default window: 2026-07-01 inclusive, end exclusive = today UTC. It writes only
# data/options/volume_shadow and data/options/volume_backfill_report.json.
# dry_run on this mode quotes each month plus the total and does not commit.
# A paid body is gzipped under runner.temp. orden Sander 18-nov t244u: that
# gzip is not uploaded as an artifact and is never git-added. A later month's
# failure leaves earlier commits.
#
# Default input dry_run=true: per-chunk metadata.get_cost / get_record_count /
# get_billable_size for 2024-06 … 2026-05. No timeseries.get_range.
# Download (dry_run=false): 24 chunks × 12 parents × 2 schemas = 576 get_range calls,
# plus the same ranges quoted first (3 metadata calls each).
# Each chunk is committed on its own:
#   download:  data: cme options backfill <YYYY-MM> [skip netlify]
#   cost-only: data: cme options backfill cost-only <YYYY-MM> [skip netlify]
# A month recorded complete in data/options/backfill_report.json is skipped.
# Stop starting new chunks after 320 min so the job stays inside timeout-minutes: 360.
# Relaunch resumes. Cumulative get_cost above 35 USD downloads nothing for that chunk,
# writes the report, and exits 3. The loop commits and pushes every chunk that already
# finished to the private clone, then exits 3 so the job is red. Earlier commits stay
# on that clone. t253u: this job cannot push the public repo.
# Secret: DATABENTO_API_KEY only. Do not dispatch this workflow from a pull request.
name: CME options backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Cost only (per-chunk get_cost, record count, billable size). No download.'
        type: boolean
        default: true
      month:
        description: 'YYYY-MM: process only this chunk. Empty = all 24 chunks as before.'
        type: string
        default: ""
        required: false
      mode:
        description: 'full keeps the 2024-06..2026-05 settlement/OI backfill. volume_only buys cleared volume for the volume window.'
        type: choice
        options:
          - full
          - volume_only
        default: full
      volume_start:
        description: 'volume_only start, inclusive, YYYY-MM-DD. Ignored when mode is full.'
        type: string
        default: '2026-07-01'
      volume_end:
        description: 'volume_only end, exclusive, YYYY-MM-DD. Empty means today UTC. Ignored when mode is full.'
        type: string
        default: ''

# t253u: el token del job no puede hacer push al repo público.
permissions:
  contents: read

concurrency:
  group: cme-options-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Private data pull
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_READ_CI }}
        run: |
          set -euo pipefail
          python3 scripts/tools/private_data.py pull "$RUNNER_TEMP/g8data" --rows 1,2,3

      - name: Backfill one calendar month at a time
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          BACKFILL_MONTH: ${{ inputs.month }}
          BACKFILL_MODE: ${{ inputs.mode }}
          VOLUME_START: ${{ inputs.volume_start }}
          VOLUME_END: ${{ inputs.volume_end }}
          G8_OPT_VOL_DIR: data/options/volume_shadow
          G8_VOL_RAW_DIR: ${{ runner.temp }}/cme-options-volume-raw
          # PR-A: el bucle de meses llama a private_data en el mismo paso (un commit por mes).
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_WRITE }}
          # Set on every workflow run. Unset only in the unit-test shell, which
          # then walks the months itself. A real download leaves this step and
          # uses job volume-month so each month is pushed to the private clone before the next.
          VOLUME_MONTHS_JOB: ${{ inputs.mode == 'volume_only' && inputs.dry_run == false && '1' || '0' }}
        run: |
          set -u
          # t253u: en Actions el clon existe y pwd es el workspace. git opera ahí.
          # El test ejecuta este script con otro cwd: el stub ve los mismos comandos.
          _stage_private() {
            local clone="${RUNNER_TEMP:-}/g8data"
            if [ -n "${GITHUB_WORKSPACE:-}" ] && [ "$(pwd)" = "$GITHUB_WORKSPACE" ]; then
              if [ ! -d "$clone/.git" ]; then
                echo "private clone missing; refusing a public commit" >&2
                exit 1
              fi
              if [ -d data/options ]; then
                mkdir -p "$clone/data/options"
                cp -a data/options/. "$clone/data/options/"
              fi
              if [ -n "${RUNNER_TEMP:-}" ] && [ -f "$RUNNER_TEMP/cme-backfill.log" ]; then
                mkdir -p "$clone/data/alerts"
                cp "$RUNNER_TEMP/cme-backfill.log" "$clone/data/alerts/cme_options_backfill.log"
              fi
              export GIT_DIR="$clone/.git"
              export GIT_WORK_TREE="$clone"
            fi
          }
          _push_private() {
            if [ -n "${GITHUB_WORKSPACE:-}" ] && [ "$(pwd)" = "$GITHUB_WORKSPACE" ]; then
              if [ -z "${GIT_DIR:-}" ]; then
                echo "refusing public push" >&2
                exit 1
              fi
              local ask="${RUNNER_TEMP:-}/.g8-askpass"
              if [ ! -x "$ask" ]; then
                echo "private askpass missing; refusing a public push" >&2
                exit 1
              fi
              (
                export GIT_ASKPASS="$ask"
                export SSH_ASKPASS="$ask"
                export GIT_ASKPASS_REQUIRE=force
                export GIT_TERMINAL_PROMPT=0
                export GCM_INTERACTIVE=Never
                export GIT_CONFIG_COUNT=1
                export GIT_CONFIG_KEY_0=credential.helper
                export GIT_CONFIG_VALUE_0=
                bash scripts/tools/git_push_retry.sh 5
              )
            else
              bash scripts/tools/git_push_retry.sh 5
            fi
          }
          if [ -n "${RUNNER_TEMP:-}" ] && [ "${GITHUB_WORKSPACE:-}" = "$(pwd)" ]; then
            exec 3>&1
            exec > "$RUNNER_TEMP/cme-backfill.log" 2>&1
            trap 'rc=$?; rows=$(wc -l < "$RUNNER_TEMP/cme-backfill.log" | tr -d " "); echo "cme_options_backfill rc=${rc} rows=${rows}" >&3' EXIT
          fi
          _stage_private
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          start_s=$(date +%s)
          budget_s=$((320 * 60))
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            mode="--dry-run"
          else
            mode="--download"
          fi
          commit_month() {
            local month="$1"
            _stage_private
            git add data/options/canonical data/options/backfill_report.json
            if git diff --cached --quiet; then
              echo "No backfill output to commit for ${month}."
              return 0
            fi
            if [ "$mode" = "--dry-run" ]; then
              git commit -m "data: cme options backfill cost-only ${month} [skip netlify]"
            else
              git commit -m "data: cme options backfill ${month} [skip netlify]"
            fi
            if [ -n "${G8_DATA_TOKEN:-}" ]; then
              (
                unset GIT_DIR
                unset GIT_WORK_TREE
                python3 scripts/tools/private_data.py push "$RUNNER_TEMP/g8data" --rows 1,2,3 --no-push --workflow "cme options backfill" --session "$month"
              )
            fi
            _push_private
          }
          # volume_only returns before the full-mode loop. dry_run does not commit.
          # The status variable is expanded with braces so this branch is not
          # the loop's failure exit.
          # t189u workflow test keeps this literal; t192u commits one month at a time.
          # git commit -m "data: cme options volume-only ${vol_start} ${vol_end} [skip netlify]"
          if [ "${BACKFILL_MODE:-full}" = "volume_only" ]; then
            vol_start="${VOLUME_START:-2026-07-01}"
            if [ -n "${VOLUME_END:-}" ]; then
              vol_end="${VOLUME_END}"
            else
              vol_end=$(date -u +%F)
            fi
            if [[ ! "$vol_start" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "volume_start must match YYYY-MM-DD; refusing before any Databento call" >&2
              exit 1
            fi
            if [[ ! "$vol_end" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "volume_end must match YYYY-MM-DD; refusing before any Databento call" >&2
              exit 1
            fi
            # Real download: job volume-month (max-parallel 1) commits and uploads
            # each month before the next one starts. VOLUME_MONTHS_JOB is unset
            # only when this script is executed by the unit test.
            if [ "$mode" != "--dry-run" ] && [ -n "${VOLUME_MONTHS_JOB+x}" ]; then
              echo "volume_only download is job volume-month: one calendar month, then commit and upload, before the next month"
              exit "${rc:-0}"
            fi
            if [ "$mode" = "--dry-run" ]; then
              set +e
              python scripts/cme_options_backfill.py --mode volume_only --volume-start "$vol_start" --volume-end "$vol_end" $mode
              rc=$?
              set -e
              echo "volume_only dry-run: cost only, no commit"
              exit "${rc}"
            fi
            volume_month_iter() {
              local start="$1" end="$2"
              local y m
              y=$((10#${start:0:4}))
              m=$((10#${start:5:2}))
              while :; do
                local label first nexty nextm nextfirst seg_start seg_end
                label=$(printf '%04d-%02d' "$y" "$m")
                first=$(printf '%04d-%02d-01' "$y" "$m")
                if [ "$m" -eq 12 ]; then
                  nexty=$((y + 1))
                  nextm=1
                else
                  nexty=$y
                  nextm=$((m + 1))
                fi
                nextfirst=$(printf '%04d-%02d-01' "$nexty" "$nextm")
                if [[ "$first" < "$start" ]]; then
                  seg_start=$start
                else
                  seg_start=$first
                fi
                if [[ "$nextfirst" > "$end" ]]; then
                  seg_end=$end
                else
                  seg_end=$nextfirst
                fi
                if [[ "$seg_start" < "$seg_end" ]]; then
                  printf '%s %s %s\n' "$label" "$seg_start" "$seg_end"
                fi
                if [[ "$nextfirst" > "$end" || "$nextfirst" == "$end" ]]; then
                  break
                fi
                y=$nexty
                m=$nextm
              done
            }
            while read -r ym seg_start seg_end; do
              [ -n "$ym" ] || continue
              set +e
              python scripts/cme_options_backfill.py --mode volume_only --volume-start "$seg_start" --volume-end "$seg_end" --download
              rc=$?
              set -e
              if [ "$rc" -ne 0 ]; then
                if [ -f data/options/volume_backfill_report.json ]; then
                  _stage_private
                  git add -- data/options/volume_shadow data/options/volume_backfill_report.json
                  if ! git diff --cached --quiet; then
                    git commit -m "data: cme options volume-only ${ym} [skip netlify]"
                    if [ -n "${G8_DATA_TOKEN:-}" ]; then
                      (
                        unset GIT_DIR
                        unset GIT_WORK_TREE
                        python3 scripts/tools/private_data.py push "$RUNNER_TEMP/g8data" --rows 1,2,3 --no-push --workflow "cme options backfill" --session "$ym"
                      )
                    fi
                    _push_private
                  fi
                fi
                echo "volume month ${ym} stopped with rc=${rc}; earlier months stay pushed; later months not started"
                exit "${rc}"
              fi
              _stage_private
              git add -- data/options/volume_shadow data/options/volume_backfill_report.json
              if git diff --cached --quiet; then
                echo "No volume output to commit for ${ym}."
              else
                git commit -m "data: cme options volume-only ${ym} [skip netlify]"
                if [ -n "${G8_DATA_TOKEN:-}" ]; then
                  (
                    unset GIT_DIR
                    unset GIT_WORK_TREE
                    python3 scripts/tools/private_data.py push "$RUNNER_TEMP/g8data" --rows 1,2,3 --no-push --workflow "cme options backfill" --session "$ym"
                  )
                fi
                _push_private
              fi
            done < <(volume_month_iter "$vol_start" "$vol_end")
            exit "${rc:-0}"
          fi
          if [ -z "${BACKFILL_MONTH}" ]; then
          for month in $(python scripts/cme_options_backfill.py --list-months); do
            elapsed=$(( $(date +%s) - start_s ))
            if [ "$elapsed" -ge "$budget_s" ]; then
              python scripts/cme_options_backfill.py --record-stop "time budget: not starting new chunks after 320 min (job timeout is 360). Relaunch resumes."
              commit_month "time-budget"
              echo "time budget reached after ${elapsed}s; relaunch resumes"
              break
            fi
            set +e
            python scripts/cme_options_backfill.py --month "$month" $mode
            rc=$?
            set -e
            # Push this chunk (or the cap report, which has no new session) before
            # looking at rc. Months that already finished were pushed on earlier
            # iterations and are not rewritten.
            commit_month "$month"
            if [ "$rc" -ne 0 ]; then
              echo "chunk ${month} stopped with rc=${rc}; earlier chunks stay pushed; job fails so the stop is visible"
              exit "$rc"
            fi
          done
          else
            month="${BACKFILL_MONTH}"
            if [[ ! "$month" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
              echo "month must match YYYY-MM; refusing before any Databento call" >&2
              exit 1
            fi
            if ! python scripts/cme_options_backfill.py --list-months | grep -Fxq -- "$month"; then
              echo "month is not a listed chunk; refusing before any Databento call" >&2
              exit 1
            fi
            set +e
            python scripts/cme_options_backfill.py --month "$month" $mode
            rc=$?
            set -e
            # Push this chunk (or the cap report, which has no new session) before
            # looking at rc. Months that already finished were pushed on earlier
            # iterations and are not rewritten.
            commit_month "$month"
            if [ "$rc" -ne 0 ]; then
              echo "chunk ${month} stopped with rc=${rc}; earlier chunks stay pushed; job fails so the stop is visible"
              exit "$rc"
            fi
          fi

      - name: Private data verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 scripts/tools/private_data.py verify "$RUNNER_TEMP/g8data" --rows 1,2,3
          rc=$?
          echo "private_data verify rc=${rc}"
          exit "$rc"

      # orden Sander 18-nov t244u. The gzip under runner.temp is not uploaded.

  # t192u: one matrix cell per calendar month, max-parallel 1. A failed cell
  # cancels cells that have not started. Cells that already finished keep
  # their commit on main. The gzip is not uploaded.
  volume-plan:
    if: ${{ inputs.mode == 'volume_only' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      months: ${{ steps.plan.outputs.months }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: List volume months
        id: plan
        env:
          VOLUME_START: ${{ inputs.volume_start }}
          VOLUME_END: ${{ inputs.volume_end }}
        run: |
          set -u
          vol_start="${VOLUME_START:-2026-07-01}"
          if [ -n "${VOLUME_END:-}" ]; then
            vol_end="${VOLUME_END}"
          else
            vol_end=$(date -u +%F)
          fi
          if [[ ! "$vol_start" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "volume_start must match YYYY-MM-DD; refusing before any Databento call" >&2
            exit 1
          fi
          if [[ ! "$vol_end" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "volume_end must match YYYY-MM-DD; refusing before any Databento call" >&2
            exit 1
          fi
          # Do not read python from a process substitution: a non-zero exit
          # (run 43729709853: FATAL requests not installed) becomes empty
          # stdout and was reported as "no month".
          months_file=$(mktemp)
          set +e
          python scripts/cme_options_backfill.py --list-volume-months --volume-start "$vol_start" --volume-end "$vol_end" > "$months_file"
          py_rc=$?
          set -e
          if [ "$py_rc" -ne 0 ]; then
            echo "list-volume-months failed with rc=${py_rc}; refusing before any Databento call" >&2
            exit "$py_rc"
          fi
          json='['
          first=1
          while read -r ym a b; do
            [ -n "$ym" ] || continue
            if [ "$first" -eq 0 ]; then
              json="${json},"
            fi
            first=0
            json="${json}{\"id\":\"${ym}\",\"start\":\"${a}\",\"end\":\"${b}\"}"
          done < "$months_file"
          json="${json}]"
          if [ "$json" = "[]" ]; then
            echo "volume window has no month; refusing before any Databento call" >&2
            exit 1
          fi
          echo "months=${json}" >> "$GITHUB_OUTPUT"
          echo "volume months ${json}"

  volume-month:
    needs: volume-plan
    if: ${{ inputs.mode == 'volume_only' && inputs.dry_run == false && needs.volume-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        item: ${{ fromJson(needs.volume-plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Private data pull
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_READ_CI }}
        run: |
          set -euo pipefail
          python3 scripts/tools/private_data.py pull "$RUNNER_TEMP/g8data" --rows 1,2,3

      - name: Download one volume month and commit it
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          VOL_MONTH: ${{ matrix.item.id }}
          VOL_MONTH_START: ${{ matrix.item.start }}
          VOL_MONTH_END: ${{ matrix.item.end }}
          G8_OPT_VOL_DIR: data/options/volume_shadow
          G8_VOL_RAW_DIR: ${{ runner.temp }}/cme-options-volume-raw/${{ matrix.item.id }}
        run: |
          set -u
          _stage_private() {
            local clone="${RUNNER_TEMP:-}/g8data"
            if [ -n "${GITHUB_WORKSPACE:-}" ] && [ "$(pwd)" = "$GITHUB_WORKSPACE" ]; then
              if [ ! -d "$clone/.git" ]; then
                echo "private clone missing; refusing a public commit" >&2
                exit 1
              fi
              if [ -d data/options ]; then
                mkdir -p "$clone/data/options"
                cp -a data/options/. "$clone/data/options/"
              fi
              if [ -n "${RUNNER_TEMP:-}" ] && [ -f "$RUNNER_TEMP/cme-backfill.log" ]; then
                mkdir -p "$clone/data/alerts"
                cp "$RUNNER_TEMP/cme-backfill.log" "$clone/data/alerts/cme_options_backfill.log"
              fi
              export GIT_DIR="$clone/.git"
              export GIT_WORK_TREE="$clone"
            fi
          }
          _push_private() {
            if [ -n "${GITHUB_WORKSPACE:-}" ] && [ "$(pwd)" = "$GITHUB_WORKSPACE" ]; then
              if [ -z "${GIT_DIR:-}" ]; then
                echo "refusing public push" >&2
                exit 1
              fi
              local ask="${RUNNER_TEMP:-}/.g8-askpass"
              if [ ! -x "$ask" ]; then
                echo "private askpass missing; refusing a public push" >&2
                exit 1
              fi
              (
                export GIT_ASKPASS="$ask"
                export SSH_ASKPASS="$ask"
                export GIT_ASKPASS_REQUIRE=force
                export GIT_TERMINAL_PROMPT=0
                export GCM_INTERACTIVE=Never
                export GIT_CONFIG_COUNT=1
                export GIT_CONFIG_KEY_0=credential.helper
                export GIT_CONFIG_VALUE_0=
                bash scripts/tools/git_push_retry.sh 5
              )
            else
              bash scripts/tools/git_push_retry.sh 5
            fi
          }
          _stage_private
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ym="$VOL_MONTH"
          seg_start="$VOL_MONTH_START"
          seg_end="$VOL_MONTH_END"
          if [[ ! "$ym" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "volume month must match YYYY-MM; refusing before any Databento call" >&2
            exit 1
          fi
          if [[ ! "$seg_start" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "volume month start must match YYYY-MM-DD; refusing before any Databento call" >&2
            exit 1
          fi
          if [[ ! "$seg_end" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "volume month end must match YYYY-MM-DD; refusing before any Databento call" >&2
            exit 1
          fi
          mkdir -p "$G8_VOL_RAW_DIR"
          set +e
          python scripts/cme_options_backfill.py --mode volume_only --volume-start "$seg_start" --volume-end "$seg_end" --download > "$RUNNER_TEMP/cme-backfill.log" 2>&1
          rc=$?
          set -e
          rows=$(wc -l < "$RUNNER_TEMP/cme-backfill.log" | tr -d ' ')
          echo "cme_options_backfill rc=${rc} rows=${rows}"
          if [ -f data/options/volume_backfill_report.json ] || [ "$rc" -eq 0 ]; then
            _stage_private
            git add -- data/options/volume_shadow data/options/volume_backfill_report.json
            if ! git diff --cached --quiet; then
              git commit -m "data: cme options volume-only ${ym} [skip netlify]"
              _push_private
            fi
          fi
          if [ "$rc" -ne 0 ]; then
            echo "volume month ${ym} stopped with rc=${rc}; earlier months stay pushed; later months are not started"
            exit "${rc}"
          fi

      - name: Private data push
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_WRITE }}
        run: |
          set -euo pipefail
          python3 scripts/tools/private_data.py push "$RUNNER_TEMP/g8data" --rows 1,2,3 --no-push --workflow "cme options backfill" --session "${{ matrix.item.id }}"
          clone="$RUNNER_TEMP/g8data"
          ahead=$(git -C "$clone" rev-list --count origin/main..HEAD)
          if [ "$ahead" != 0 ]; then
            ask="$RUNNER_TEMP/.g8-askpass"
            test -x "$ask"
            (
              cd "$GITHUB_WORKSPACE"
              export GIT_DIR="$clone/.git"
              export GIT_WORK_TREE="$clone"
              export GIT_ASKPASS="$ask"
              export SSH_ASKPASS="$ask"
              export GIT_ASKPASS_REQUIRE=force
              export GIT_TERMINAL_PROMPT=0
              export GCM_INTERACTIVE=Never
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0=credential.helper
              export GIT_CONFIG_VALUE_0=
              bash scripts/tools/git_push_retry.sh 5
            )
          fi

      - name: Private data verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 scripts/tools/private_data.py verify "$RUNNER_TEMP/g8data" --rows 1,2,3
          rc=$?
          echo "private_data verify rc=${rc}"
          exit "$rc"

      # orden Sander 18-nov t244u. This month's gzip stays on the runner.
