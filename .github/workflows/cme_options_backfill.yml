# Resumable CME FX options backfill (Databento GLBX.MDP3), one calendar month per commit.
# workflow_dispatch only. Nothing runs until this file is on main and Sander starts it.
# Do not add a schedule. test_p12 would then require a Mac dispatch slot.
# Optional input month (YYYY-MM, default empty): process one chunk. Empty keeps the
# 24-chunk loop byte for byte. The value is the env var BACKFILL_MONTH, never
# interpolated in the shell. A value that fails ^[0-9]{4}-[0-9]{2}$ or is absent
# from --list-months stops the job before any Databento call.
#
# mode=full (default) is that loop. mode=volume_only (order t189u, Sander,
# 15-nov-2026) quotes the whole window first (metadata.get_cost, record count,
# billable size). Above 6.00 USD it exits non-zero and downloads nothing.
# Default window: 2026-07-01 inclusive, end exclusive = today UTC. It writes only
# data/options/volume_shadow and data/options/volume_backfill_report.json.
# dry_run on this mode prints the quote and does not commit. A paid body is
# gzipped under runner.temp and uploaded as an artifact (90 days), never git-added.
#
# Default input dry_run=true: per-chunk metadata.get_cost / get_record_count /
# get_billable_size for 2024-06 … 2026-05. No timeseries.get_range.
# Download (dry_run=false): 24 chunks × 12 parents × 2 schemas = 576 get_range calls,
# plus the same ranges quoted first (3 metadata calls each).
# Each chunk is committed on its own:
#   download:  data: cme options backfill <YYYY-MM> [skip netlify]
#   cost-only: data: cme options backfill cost-only <YYYY-MM> [skip netlify]
# A month recorded complete in data/options/backfill_report.json is skipped.
# Stop starting new chunks after 320 min so the job stays inside timeout-minutes: 360.
# Relaunch resumes. Cumulative get_cost above 35 USD downloads nothing for that chunk,
# writes the report, and exits 3. The loop commits and pushes every chunk that already
# finished, then exits 3 so the job is red. Earlier commits stay on main.
# Secret: DATABENTO_API_KEY only. Do not dispatch this workflow from a pull request.
name: CME options backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Cost only (per-chunk get_cost, record count, billable size). No download.'
        type: boolean
        default: true
      month:
        description: 'YYYY-MM: process only this chunk. Empty = all 24 chunks as before.'
        type: string
        default: ""
        required: false
      mode:
        description: 'full keeps the 2024-06..2026-05 settlement/OI backfill. volume_only buys cleared volume for the volume window.'
        type: choice
        options:
          - full
          - volume_only
        default: full
      volume_start:
        description: 'volume_only start, inclusive, YYYY-MM-DD. Ignored when mode is full.'
        type: string
        default: '2026-07-01'
      volume_end:
        description: 'volume_only end, exclusive, YYYY-MM-DD. Empty means today UTC. Ignored when mode is full.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: cme-options-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Backfill one calendar month at a time
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          BACKFILL_MONTH: ${{ inputs.month }}
          BACKFILL_MODE: ${{ inputs.mode }}
          VOLUME_START: ${{ inputs.volume_start }}
          VOLUME_END: ${{ inputs.volume_end }}
          G8_OPT_VOL_DIR: data/options/volume_shadow
          G8_VOL_RAW_DIR: ${{ runner.temp }}/cme-options-volume-raw
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          start_s=$(date +%s)
          budget_s=$((320 * 60))
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            mode="--dry-run"
          else
            mode="--download"
          fi
          commit_month() {
            local month="$1"
            git add data/options/canonical data/options/backfill_report.json
            if git diff --cached --quiet; then
              echo "No backfill output to commit for ${month}."
              return 0
            fi
            if [ "$mode" = "--dry-run" ]; then
              git commit -m "data: cme options backfill cost-only ${month} [skip netlify]"
            else
              git commit -m "data: cme options backfill ${month} [skip netlify]"
            fi
            bash scripts/tools/git_push_retry.sh 5
          }
          # volume_only returns before the full-mode loop. dry_run does not commit.
          # The status variable is expanded with braces so this branch is not
          # the loop's failure exit.
          if [ "${BACKFILL_MODE:-full}" = "volume_only" ]; then
            vol_start="${VOLUME_START:-2026-07-01}"
            if [ -n "${VOLUME_END:-}" ]; then
              vol_end="${VOLUME_END}"
            else
              vol_end=$(date -u +%F)
            fi
            if [[ ! "$vol_start" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "volume_start must match YYYY-MM-DD; refusing before any Databento call" >&2
              exit 1
            fi
            if [[ ! "$vol_end" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "volume_end must match YYYY-MM-DD; refusing before any Databento call" >&2
              exit 1
            fi
            set +e
            python scripts/cme_options_backfill.py --mode volume_only --volume-start "$vol_start" --volume-end "$vol_end" $mode
            rc=$?
            set -e
            if [ "$mode" = "--dry-run" ]; then
              echo "volume_only dry-run: cost only, no commit"
              exit "${rc}"
            fi
            if [ "$rc" -ne 0 ]; then
              echo "volume_only stopped with rc=${rc}; not committing"
              exit "${rc}"
            fi
            git add -- data/options/volume_shadow data/options/volume_backfill_report.json
            if git diff --cached --quiet; then
              echo "No volume output to commit."
              exit "${rc}"
            fi
            git commit -m "data: cme options volume-only ${vol_start} ${vol_end} [skip netlify]"
            bash scripts/tools/git_push_retry.sh 5
            exit "${rc}"
          fi
          if [ -z "${BACKFILL_MONTH}" ]; then
          for month in $(python scripts/cme_options_backfill.py --list-months); do
            elapsed=$(( $(date +%s) - start_s ))
            if [ "$elapsed" -ge "$budget_s" ]; then
              python scripts/cme_options_backfill.py --record-stop "time budget: not starting new chunks after 320 min (job timeout is 360). Relaunch resumes."
              commit_month "time-budget"
              echo "time budget reached after ${elapsed}s; relaunch resumes"
              break
            fi
            set +e
            python scripts/cme_options_backfill.py --month "$month" $mode
            rc=$?
            set -e
            # Push this chunk (or the cap report, which has no new session) before
            # looking at rc. Months that already finished were pushed on earlier
            # iterations and are not rewritten.
            commit_month "$month"
            if [ "$rc" -ne 0 ]; then
              echo "chunk ${month} stopped with rc=${rc}; earlier chunks stay pushed; job fails so the stop is visible"
              exit "$rc"
            fi
          done
          else
            month="${BACKFILL_MONTH}"
            if [[ ! "$month" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
              echo "month must match YYYY-MM; refusing before any Databento call" >&2
              exit 1
            fi
            if ! python scripts/cme_options_backfill.py --list-months | grep -Fxq -- "$month"; then
              echo "month is not a listed chunk; refusing before any Databento call" >&2
              exit 1
            fi
            set +e
            python scripts/cme_options_backfill.py --month "$month" $mode
            rc=$?
            set -e
            # Push this chunk (or the cap report, which has no new session) before
            # looking at rc. Months that already finished were pushed on earlier
            # iterations and are not rewritten.
            commit_month "$month"
            if [ "$rc" -ne 0 ]; then
              echo "chunk ${month} stopped with rc=${rc}; earlier chunks stay pushed; job fails so the stop is visible"
              exit "$rc"
            fi
          fi

      # t186u / t189u: paid Databento body, gzipped, never git-added. 90 days.
      # Full mode writes nothing here, so the step finds no files.
      - name: Upload compressed Databento original (t189u)
        if: ${{ always() && inputs.mode == 'volume_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: cme-options-volume-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/cme-options-volume-raw
          retention-days: 90
          if-no-files-found: ignore
