name: Freshness snapshot (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/actas/ACTA_FRESHNESS_COMPLETION_20261004.md']
permissions:
  contents: write
concurrency:
  group: g8-shared-data-alerts
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      G8_NO_SEND: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main       # acta P-11: tip of main when the job starts, not the SHA frozen while queued
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh read-only dashboard evidence (no notifications)
        run: |
          python scripts/tools/refresh_brief_snapshot.py
          python scripts/health_monitor.py
      - name: Publish only dashboard snapshots
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add data/alerts/brief.json data/_ingest/health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh verified dashboard freshness evidence'
          bash scripts/tools/git_push_retry.sh 5   # acta P-11 (helper P-7)
