# .github/workflows/metals_update.yml
# Metals Fair Value / MDP (§06 Gold · §07 Silver) — fully automatic.
# metals_fairvalue_g8.py v3 (Kalman TVP under MMT). Prices come from Yahoo/Stooq
# (headless), NFA from Treasury/FRED, breakeven from data/RY_G8_USD.csv, slope+DXY
# from FRED — no local TradingView exports needed. Weekly cadence (COT is W-TUE).
name: Metals Fair Value (MDP)

on:
  schedule:
    # Saturdays 07:00 UTC — after Friday's CFTC COT release; the model anchors to
    # the Tuesday-COT grid, so once a week keeps §06/§07 within their weekly budget.
    - cron: '0 7 * * 6'
  push:
    branches: [main]
    paths: ['docs/actas/ACTA_FEED_PROVENANCE_20261004.md']
  workflow_dispatch:   # manual "Run workflow" button

concurrency:
  group: g8-shared-data-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      G8_NO_SEND: '1'
      G8_STEP_LOG: ${{ runner.temp }}/metals_steps.jsonl
      G8_JOB: metals        # revisión 24-sep (#5): aplazamientos Retry-After en data/_ingest/not_before/metals.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute metals fair value (XAU + XAG)
        id: compute
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional; keyless FRED CSV fallback if unset
        timeout-minutes: 20
        run: python scripts/tools/g8step.py --name metals_fairvalue --cap 1080 -- python scripts/metals_fairvalue_g8.py

      - name: Record computation outcome and refresh read-only snapshots
        if: always()
        run: |
          if [ "${{ steps.compute.outcome }}" != "success" ]; then
            git restore -- data/MFV_G8_XAU.csv data/MFV_G8_XAG.csv data/MFV_G8_state.json data/MFV_G8_walkforward_XAU.csv data/MFV_G8_walkforward_XAG.csv
          fi
          python scripts/tools/g8step.py --ledger metals
          python scripts/tools/refresh_brief_snapshot.py
          python scripts/health_monitor.py

      - name: Commit updated metals data
        if: always()
        timeout-minutes: 3
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A failed/partial computation must never publish a mixed cohort.
          if [ "${{ steps.compute.outcome }}" = "success" ]; then
            git add data/MFV_G8_XAU.csv data/MFV_G8_XAG.csv data/MFV_G8_state.json
            git add data/MFV_G8_walkforward_XAU.csv data/MFV_G8_walkforward_XAG.csv
          fi
          git add data/_ingest/metals_provenance.json 2>/dev/null || true
          git add data/_ingest/latest/actions__job_metals.json
          git add data/_ingest/health.json data/alerts/brief.json
          git add data/_ingest/not_before/metals.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No metals changes — skipping commit"
            exit 0
          fi
          git commit -m "chore: weekly metals fair value update $(date -u '+%Y-%m-%d')"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "✓ pushed on attempt $attempt"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "✗ push failed after 5 attempts"; exit 1

      - name: Fail visibly when computation failed
        if: always() && steps.compute.outcome != 'success'
        run: exit 1
