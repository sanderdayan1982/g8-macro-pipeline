# .github/workflows/metals_update.yml
# Metals Fair Value / MDP (§06 Gold · §07 Silver) — fully automatic.
# metals_fairvalue_g8.py v3 (Kalman TVP under MMT). Prices come from Yahoo/Stooq
# (headless), NFA from Treasury/FRED, breakeven from data/RY_G8_USD.csv, slope+DXY
# from FRED — no local TradingView exports needed.
# t354u (orden Sander 24-nov): el semanal y la sombra corren en el VPS (vps/metals_vps.py, timers g8-metals-weekly y g8-metals-shadow);
# aquí queda solo como respaldo manual. Secretos: G8_DATA_READ_CI, G8_DATA_WRITE, FRED_API_KEY,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (solo nombres).
# El contrato de §06/§07 sigue siendo semanal (ancla W-TUE). La pasada de lunes a
# viernes solo refresca la proyección diaria en SHADOW (B2); no sustituye el MDP semanal.
name: Metals Fair Value (MDP)

on:
  # orden Sander 24-nov: migrado al VPS, sin cron ni turno en GitHub (t354u).
  # MDP semanal: timer g8-metals-weekly (sáb 07:00 UTC). SHADOW B2: timer g8-metals-shadow (L–V 22:45 UTC).
  # Aquí queda solo el lanzamiento manual de respaldo. Nunca dos publicaciones del mismo feed.
  workflow_dispatch:   # respaldo manual "Run workflow"

concurrency:
  group: g8-shared-data-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      G8_NO_SEND: '1'
      G8_JOB: metals        # revisión 24-sep (#5): aplazamientos Retry-After en data/_ingest/not_before/metals.json
    steps:
      - name: Initialize step ledger path
        run: echo "G8_STEP_LOG=$RUNNER_TEMP/metals_steps.jsonl" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main       # acta P-11: tip of main when the job starts, not the SHA frozen while queued
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Private data pull
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_READ_CI }}
        run: |
          set -euo pipefail
          python3 scripts/tools/private_data.py pull "$RUNNER_TEMP/g8data" --rows 6,11,12

      - name: Compute metals fair value (XAU + XAG)
        id: compute
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional; keyless FRED CSV fallback if unset
        timeout-minutes: 20
        run: python scripts/tools/g8step.py --name metals_fairvalue --cap 1080 -- python scripts/metals_fairvalue_g8.py

      - name: Record computation outcome and refresh read-only snapshots
        if: always()
        run: |
          if [ "${{ steps.compute.outcome }}" != "success" ]; then
            git restore -- data/MFV_G8_XAU.csv data/MFV_G8_XAG.csv data/MFV_G8_state.json data/MFV_G8_walkforward_XAU.csv data/MFV_G8_walkforward_XAG.csv
          fi
          python scripts/tools/g8step.py --ledger metals
          python scripts/tools/refresh_brief_snapshot.py
          python scripts/health_monitor.py

      - name: Commit updated metals data
        if: always()
        timeout-minutes: 3
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A failed/partial computation must never publish a mixed cohort.
          if [ "${{ steps.compute.outcome }}" = "success" ]; then
            git add data/MFV_G8_XAU.csv data/MFV_G8_XAG.csv data/MFV_G8_state.json
            git add data/MFV_G8_walkforward_XAU.csv data/MFV_G8_walkforward_XAG.csv
            # B2 SHADOW: paralelo al semanal. Si la sombra no se escribió, el semanal se publica igual.
            git add -- data/MFV_G8_XAU_daily_shadow.csv data/MFV_G8_XAG_daily_shadow.csv data/MFV_G8_shadow_state.json || true
          fi
          git add data/_ingest/metals_provenance.json 2>/dev/null || true
          git add data/_ingest/latest/actions__job_metals.json
          git add data/_ingest/health.json data/alerts/brief.json
          git add data/_ingest/not_before/metals.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No metals changes — skipping commit"
            exit 0
          fi
          git commit -m "chore: weekly metals fair value update $(date -u '+%Y-%m-%d')"
          # t273u: private_data pull --rows 12 overwrites tracked data/alerts/state.json
          # so refresh_brief can read the private copy. That file must not be committed
          # to the public repo, so it stays unstaged and git_push_retry (pull --rebase)
          # fails with "You have unstaged changes". Stash it for the public push, then
          # restore it so the later private push of rows 11,12 still sees the private copy.
          stashed=0
          if ! git diff --quiet -- data/alerts/state.json; then
            git stash push -m "t273u: private state.json during public push" -- data/alerts/state.json
            stashed=1
          fi
          set +e
          bash scripts/tools/git_push_retry.sh 5   # acta P-11 (helper P-7)
          rc=$?
          set -e
          if [ "$stashed" = 1 ]; then
            git stash pop
          fi
          exit $rc

      - name: Private data push
        if: always()
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_WRITE }}
        run: |
          set -euo pipefail
          python3 scripts/tools/private_data.py push "$RUNNER_TEMP/g8data" \
            --rows 11,12 --workflow "metals_update" --session "$(date -u +%F)"

      - name: Private data verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 scripts/tools/private_data.py verify "$RUNNER_TEMP/g8data" --rows 11,12
          rc=$?
          echo "private_data verify rc=${rc}"
          # t297u (b): rc≠0 (differ>0 o fallo) queda en data/_ingest/latest/actions__job_verify_metals.json,
          # que lee ingest_watch. Se sube aparte (worktree, [skip netlify]); el paso sigue sin tumbar el job.
          python3 scripts/tools/step_alarm.py record private_verify_metals "$rc" --detail "private_data verify rc=${rc}"
          python3 scripts/tools/step_alarm.py publish verify_metals --only private_verify_metals --commit
          exit "$rc"

      - name: Fail visibly when computation failed
        if: always() && steps.compute.outcome != 'success'
        run: exit 1

      # ── Ley 2 (fallos ruidosos): cualquier paso rojo → Telegram, no solo email ──
      - name: Alert on failure
        if: failure()
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --fail "workflow=metals_update run=${{ github.run_number }} — ver Actions"
