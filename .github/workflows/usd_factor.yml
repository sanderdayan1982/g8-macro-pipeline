# ============================================================================
# §10 Factor USD · Residuales · Libro — daily (ACTA_UF1, 17-sep-2026)
# BCE reference rates publish ~16:00 CET on TARGET days → 15:30 UTC is after
# the summer publication (14:00 UTC) and the winter one (15:00 UTC); a second
# window at 17:30 UTC catches a late publication. Idempotent: no new BCE date
# → NO_NEW_DATA, nothing to commit. TARGET holidays are not failures (Ley 2:
# only a real error is loud).
# $0: BCE SDMX (free), FRED csv (free, optional twin), repo files only.
# ============================================================================
name: USD Factor

on:
  schedule:
    - cron: '30 15 * * 1-5'
    - cron: '30 17 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: g8-shared-data-alerts
  cancel-in-progress: false

jobs:
  factor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests numpy pandas

      - name: Factor USD (BCE triangulado → USD_FACTOR.json + canonical.csv)
        run: python scripts/usd_factor.py

      - name: Book risk (book.csv / candidate.csv → BOOK_RISK.json)
        run: python scripts/book_risk.py

      # E2 §01-b (2026-09-22): PROVISIONAL preview only (S01B.json; no log/state/events). The session is
      # evaluated once, in daily_update.yml --final, after acm_g8.py has refreshed the ACM.
      - name: S01B (provisional preview if the ECB rates are already published)
        run: python scripts/s01b.py --provisional

      - name: Dashboard alerts (Telegram on change)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/dashboard_alerts.py

      # ── Lote 1 (2026-09-24): latido del Mac y credenciales ──
      - name: Ingest watch (latido del Mac + credenciales)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ingest_watch.py --result "$RUNNER_TEMP/ingest_watch.json"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # v1.0.1: book_snapshots solo existe cuando hay data/book.csv → add condicional
          git add data/usd_factor data/USD_FACTOR.json data/BOOK_RISK.json data/alerts
          if [ -f data/S01B.json ]; then git add data/S01B.json; fi
          if [ -d data/s01b ]; then git add data/s01b; fi
          if [ -d data/book_snapshots ]; then git add data/book_snapshots; fi
          if [ -f data/_ingest/watch_state.json ]; then git add data/_ingest/watch_state.json; fi
          if git diff --cached --quiet; then
            echo "No new BCE date / no change — nothing to commit."
          else
            git commit -m "chore: usd factor update $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Telegram de ingest_watch no entregado → job en rojo (GitHub envía email)
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          p = os.path.join(os.environ["RUNNER_TEMP"], "ingest_watch.json")
          d = json.load(open(p)) if os.path.exists(p) else {"delivery": "NO_RESULT"}
          print("ingest_watch entrega:", d.get("delivery"))
          sys.exit(0 if d.get("delivery") in ("SENT", "DRY", "NOTHING") else 1)
          PY

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --fail "workflow=usd_factor run=${{ github.run_number }} — ver Actions"
