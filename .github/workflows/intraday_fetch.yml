name: Intraday official feeds
on:
  schedule:
    - cron: '23 0 * * 1-5'
    - cron: '17 3 * * 1-5'
    - cron: '17 13 * * 1-5'
    - cron: '47 15 * * 1-5'
    - cron: '17 23 * * 1-5'
  workflow_dispatch:
    inputs:
      group:
        type: choice
        options: [ASIA, EU, US, LATE, ALL]
        default: ALL
permissions:
  contents: write
concurrency:
  group: g8-shared-data-alerts
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main       # acta P-11: tip of main when the job starts, not the SHA frozen while queued
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect official feeds (bounded retries; last valid output retained)
        id: feeds
        continue-on-error: true
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GROUP_INPUT: ${{ inputs.group }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          JSDA_BASE: ${{ vars.JSDA_BASE }}
          G8_STEP_LOG: ${{ runner.temp }}/intraday_steps.jsonl
        run: |
          case "$SCHEDULE" in
            '23 0 * * 1-5'|'17 3 * * 1-5') group=ASIA;;
            '17 13 * * 1-5') group=EU;;
            '47 15 * * 1-5') group=US;;
            '17 23 * * 1-5') group=LATE;;
            *) group="${GROUP_INPUT:-ALL}";;
          esac
          python scripts/tools/refresh_feeds.py "$group"
      - name: Refresh brief and health
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/dashboard_alerts.py
          python scripts/health_monitor.py
      - name: Publish valid data
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: intraday official feeds'
          bash scripts/tools/git_push_retry.sh 5   # acta P-11 (helper P-7)
      - name: Surface collection failure
        if: always() && steps.feeds.outcome == 'failure'
        run: exit 1
