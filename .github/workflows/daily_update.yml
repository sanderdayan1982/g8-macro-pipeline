# .github/workflows/daily_update.yml
name: Daily Data Update

on:
  schedule:
    # 21:30 UTC Mon-Fri (23:30 Bata) — E2 §01-b (2026-09-22): after the FRED H.15 release (~20:15 UTC EDT /
    # ~21:15 UTC EST) so acm_g8.py carries t−1 for USD and the --final S01B evaluation reads it the same day.
    # Was 18:00 UTC: the ACM then ended at t−2 and the session was locked with it.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from the Actions tab

# Prevent concurrent runs of this workflow to eliminate push race conditions
concurrency:
  group: g8-shared-data-alerts
  cancel-in-progress: false

permissions:
  contents: write  # Required to commit and push CSV updates

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Revisión 24-sep (hallazgo #3): plazo global del job y reserva para publicar. Duraciones medidas en los
    # Daily del 13 al 24-sep: job 2,5–10,7 min; ACM G8 ≤ 326 s; EUR AAA ≤ 225 s; S01B, avisos y commit < 5 s
    # cada uno. Reserva 540 s = S01B 120 + avisos 60 + vigilancia 90 + registro 15 + commit 180 + rojo 15 +
    # aviso de fallo 60. La fase de descarga dispone de ~19 min (≈2× el máximo observado). PROVISIONAL:
    # recalibrar con data/_ingest/latest/actions__job_daily.json tras 2 semanas.
    env:
      G8_JOB: daily
      G8_JOB_RESERVE_S: '540'
      # R2-1: cada paso g8step copia data/ antes de ejecutarse y, al terminar, restaura al último válido lo que
      # quede vacío, ilegible, retrocedido o escrito por un paso cortado → «git add data/» solo ve salidas válidas.
      G8_STEP_GUARD: data
      G8_GUARD_SKIP: options,futures

    steps:
      # ── 0. Plazo global: todo paso de descarga termina antes de DEADLINE − RESERVE ──
      - name: Plazo global del job (G8_JOB_DEADLINE_EPOCH)
        run: |
          echo "G8_JOB_DEADLINE_EPOCH=$(( $(date +%s) + 30*60 - 90 ))" >> "$GITHUB_ENV"
          echo "G8_STEP_LOG=$RUNNER_TEMP/g8_steps.jsonl" >> "$GITHUB_ENV"

      # ── 1. Checkout repository ─────────────────────────────────────────────
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Full history needed for rebase

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        timeout-minutes: 4
        run: pip install -r requirements.txt

      # ── 4. Run scrapers — TOLERANT mode (each independent) ────────────────
      - name: Fetch SOFR (USD anchor)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name sofr --cap 240 -- python scripts/fetch_sofr.py
        continue-on-error: true
        id: sofr

      - name: Fetch ESTR (EUR RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name estr --cap 240 -- python scripts/fetch_estr.py
        continue-on-error: true
        id: estr

      - name: Fetch SONIA (GBP RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name sonia --cap 240 -- python scripts/fetch_sonia.py
        continue-on-error: true
        id: sonia

      - name: Fetch AONIA (AUD RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name aonia --cap 240 -- python scripts/fetch_aonia.py
        continue-on-error: true
        id: aonia

      - name: Fetch TONA (JPY RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name tona --cap 240 -- python scripts/fetch_tona.py
        continue-on-error: true
        id: tona

      - name: Fetch CORRA (CAD RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name corra --cap 240 -- python scripts/fetch_corra.py
        continue-on-error: true
        id: corra

      - name: Fetch NZD OCR via BIS (NZD reference)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_ocr --cap 240 -- python scripts/fetch_bis_ocr.py
        continue-on-error: true
        id: ocr

      - name: Fetch BoE Bank Rate via BIS (GBP policy)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_gb --cap 240 -- python scripts/fetch_bis_policy.py GB
        continue-on-error: true
        id: gb_policy

      - name: Fetch BoJ Policy Rate via BIS (JPY policy)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_jp --cap 240 -- python scripts/fetch_bis_policy.py JP
        continue-on-error: true
        id: jp_policy

      - name: Fetch SNB Policy Rate via BIS (CHF policy)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_ch --cap 240 -- python scripts/fetch_bis_policy.py CH
        continue-on-error: true
        id: ch_policy

      - name: Fetch RBA Cash Rate via BIS (AUD policy)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_au --cap 240 -- python scripts/fetch_bis_policy.py AU
        continue-on-error: true
        id: au_policy

      - name: Fetch US Bills (3M/6M/1Y/2Y)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name us_bills --cap 240 -- python scripts/fetch_us_bills.py
        continue-on-error: true
        id: us_bills

      - name: Fetch CAD Bills (3M/6M/1Y)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name cad_bills --cap 240 -- python scripts/fetch_cad_bills.py
        continue-on-error: true
        id: cad_bills

      - name: Fetch AUD Bills (1M/3M/6M)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name aud_bills --cap 240 -- python scripts/fetch_aud_bills.py
        continue-on-error: true
        id: aud_bills

      - name: Fetch EUR AAA Curve (3M/6M/1Y/2Y/5Y/10Y)
        timeout-minutes: 9
        run: python scripts/tools/g8step.py --name eur_bills --cap 420 -- python scripts/fetch_eur_bills.py
        continue-on-error: true
        id: eur_bills

      - name: Fetch GBP Gilt Curve (6M/1Y/2Y/5Y/10Y)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name gbp_bills --cap 240 -- python scripts/fetch_gbp_bills.py
        continue-on-error: true
        id: gbp_bills

      - name: Fetch JPY JGB Curve (1Y/2Y/3Y/5Y/10Y/20Y)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name jpy_bills --cap 240 -- python scripts/fetch_jpy_bills.py
        continue-on-error: true
        id: jpy_bills

      # ── NZD scraper deferred pending RBNZ response (2026-06-09) ───────────
      # RBNZ (B2) and the SNB data portal reject datacenter IPs / non-browser TLS.
      # Both are fetched on the operator's Mac (launchd 08:00: fetch_nzd_b2.py +
      # fetch_chf_snb.py → push_nzd_to_github.py via the GitHub API) and consumed
      # here as repo CSVs (NZD_*.csv, CHF_*.csv). Never call those endpoints from Actions.

      - name: Fetch Floor References (IORB/DFR/BoC Target)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name floors --cap 240 -- python scripts/fetch_floor_spreads.py
        continue-on-error: true
        id: floors
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Fetch ACM 10Y Term Premium (NY Fed)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name acm_tp --cap 240 -- python scripts/fetch_acm.py
        continue-on-error: true
        id: acm

      # ── 5. Status summary ──────────────────────────────────────────────────
      - name: Report scraper results
        if: always()
        run: |
          echo "## Scraper Results — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scraper | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SOFR       | ${{ steps.sofr.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESTR       | ${{ steps.estr.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SONIA      | ${{ steps.sonia.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AONIA      | ${{ steps.aonia.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TONA       | ${{ steps.tona.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CORRA      | ${{ steps.corra.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NZD OCR    | ${{ steps.ocr.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BoE Bank Rate (GB)  | ${{ steps.gb_policy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BoJ Policy Rate (JP)| ${{ steps.jp_policy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SNB Policy Rate (CH)| ${{ steps.ch_policy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RBA Cash Rate (AU)  | ${{ steps.au_policy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| US Bills   | ${{ steps.us_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CAD Bills  | ${{ steps.cad_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AUD Bills  | ${{ steps.aud_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EUR Bills  | ${{ steps.eur_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GBP Bills  | ${{ steps.gbp_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JPY Bills  | ${{ steps.jpy_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ACM TP 10Y | ${{ steps.acm.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Floor refs (IORB/DFR/BoC) | ${{ steps.floors.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** CHF bills updated manually via convert_chf_bills.py" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** NZD bills + bonds deferred pending RBNZ response (manual quincenal in the meantime)" >> $GITHUB_STEP_SUMMARY

      # ── 5b. Long-end attribution layer (ACM decomposition + real yields) ──
      - name: ACM G8 decomposition (USD EUR JPY GBP CAD AUD)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        timeout-minutes: 13
        run: python scripts/tools/g8step.py --name acm_g8 --cap 660 -- python scripts/acm_g8.py USD EUR JPY GBP CAD AUD

      # ── 5b-bis. NZD real ACM (K=3 on RBNZ B2 1985+ spliced by the Mac fetch v1.4).
      #    Refuses (exit 1, tolerated) while the history splice hasn't landed; the next
      #    step then writes the AUD-anchored proxy (nzd_tp_synth.py v1.1 = fallback only) ──
      - name: NZD ACM decomposition (real, B2 history)
        continue-on-error: true
        timeout-minutes: 7
        run: python scripts/tools/g8step.py --name acm_nzd --cap 300 -- python scripts/acm_g8.py NZD || echo "acm NZD not available yet — proxy fallback follows"

      # ── 5b-ter. CHF real ACM (K=3 on the SNB zero curve 1988+, CHF_SPOT_*.csv from the Mac
      #    fetch_chf_snb.py). Fails (tolerated) until those files land; the frozen 2025-07
      #    ACM_G8_CHF.csv then stays in place, flagged FROZEN by the dashboard ──
      - name: CHF ACM decomposition (real, SNB curve)
        continue-on-error: true
        timeout-minutes: 7
        run: python scripts/tools/g8step.py --name acm_chf --cap 300 -- python scripts/acm_g8.py CHF || echo "acm CHF not available yet — frozen file stays"

      - name: NZD TP synth fallback (ACM_G8_NZD.csv only if no fresh real ACM)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/tools/g8step.py --name nzd_tp_synth --cap 120 -- python scripts/nzd_tp_synth.py

      - name: Real yields G8 (USD GBP CAD AUD + NZD when IIB files exist)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        timeout-minutes: 7
        run: python scripts/tools/g8step.py --name real_yields --cap 300 -- python scripts/real_yields_g8.py

      - name: Fetch EUR Real 10Y (Bundesbank DE linkers)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/tools/g8step.py --name eur_real --cap 180 -- python scripts/fetch_eur_real.py

      - name: Fetch JPY Real 10Y (JGBi on-the-run, JSDA)
        continue-on-error: true
        env:
          JSDA_BASE: ${{ vars.JSDA_BASE }}
        timeout-minutes: 5
        run: python scripts/tools/g8step.py --name jpy_real --cap 180 -- python scripts/fetch_jpy_real.py

      # ── 5c. Dashboard alerts (Telegram, one message/day only on change) ───
      # v1.0 2026-09-12: reads repo data only (no downloads, $0). State lives in
      # data/alerts/state.json and is committed by the step below (git add data/).
      # ── §01-b · lectura 22 s. + CTF (CONTEXT) — después de los ACM, antes de las alertas
      # E2: this --final run is the ONLY evaluation of the session (log + snap + state + events, write-once).
      # The midday runs in usd_factor.yml publish a PROVISIONAL S01B.json and write nothing else.
      # ── Fin de la fase de descarga: registro de pasos (omitidos/cortados por tiempo → ingest_watch avisa) ──
      - name: Registro de plazos de la fase de descarga
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/tools/g8step.py --ledger daily

      - name: S01B (22-session reading + CTF — the one evaluation per session, after acm_g8)
        if: always()
        timeout-minutes: 3
        run: python scripts/tools/g8step.py --name s01b_final --phase post --cap 120 --min 5 -- python scripts/s01b.py --final
      - name: Dashboard alerts (Telegram on change)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        timeout-minutes: 2
        run: python scripts/tools/g8step.py --name dashboard_alerts --phase post --cap 60 --min 5 -- python scripts/dashboard_alerts.py

      # ── Lote 1 (2026-09-24): latido del Mac y credenciales — aviso independiente del Mac ──
      - name: Ingest watch (latido del Mac + credenciales)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        timeout-minutes: 3
        run: python scripts/tools/g8step.py --name ingest_watch --phase post --cap 90 --min 5 -- python scripts/ingest_watch.py --result "$RUNNER_TEMP/ingest_watch.json"

      # ── 6. Commit CSVs with pull-rebase retry pattern ─────────────────────
      # Fix v2026-06-08: handles concurrent pushes (manual re-runs, rename
      # events, parallel cron). Retries up to 5 times with exponential backoff.
      - name: Commit updated data files
        if: always()
        timeout-minutes: 3
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --staged --quiet; then
            echo "No data changes detected — skipping commit"
            exit 0
          fi

          CHANGED=$(git diff --staged --name-only | wc -l)
          git commit -m "chore: daily data update $(date -u '+%Y-%m-%d') [${CHANGED} files]"

          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Push attempt $attempt of $max_attempts"

            git pull --rebase origin main

            if git push origin main; then
              echo "✓ Push successful on attempt $attempt"
              exit 0
            fi

            echo "✗ Push failed on attempt $attempt — retrying after backoff"
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

          echo "✗ Push failed after $max_attempts attempts — manual review required"
          exit 1

      - name: Telegram de ingest_watch no entregado → job en rojo (GitHub envía email)
        if: always()
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import json, os, sys
          p = os.path.join(os.environ["RUNNER_TEMP"], "ingest_watch.json")
          d = json.load(open(p)) if os.path.exists(p) else {"delivery": "NO_RESULT"}
          print("ingest_watch entrega:", d.get("delivery"))
          sys.exit(0 if d.get("delivery") in ("SENT", "DRY", "NOTHING") else 1)
          PY

      # ── Ley 2 (fallos ruidosos): cualquier paso rojo → Telegram, no solo email ──
      - name: Alert on failure
        if: failure()
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --fail "workflow=daily run=${{ github.run_number }} — ver Actions"
