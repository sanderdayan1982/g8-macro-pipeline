# .github/workflows/daily_update.yml
name: Daily Data Update

on:
  schedule:
    # 21:30 UTC Mon-Fri (23:30 Bata) — E2 §01-b (2026-09-22): after the FRED H.15 release (~20:15 UTC EDT /
    # ~21:15 UTC EST) so acm_g8.py carries t−1 for USD and the --final S01B evaluation reads it the same day.
    # Was 18:00 UTC: the ACM then ended at t−2 and the session was locked with it.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from the Actions tab

# Prevent concurrent runs of this workflow to eliminate push race conditions
concurrency:
  group: g8-shared-data-alerts
  cancel-in-progress: false

permissions:
  contents: write  # Required to commit and push CSV updates

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    # Revisión 24-sep (hallazgo #3): plazo global del job y reserva para publicar. Duraciones medidas en los
    # Daily del 13 al 24-sep: job 2,5–10,7 min; ACM G8 ≤ 326 s; EUR AAA ≤ 225 s; S01B, avisos y commit < 5 s
    # cada uno. Reserva 700 s = S01B 120 + avisos 60 + vigilancia 90 + sombras U1 3×40 + A3 40 + registro 15 +
    # commit 180 + rojo 15 + aviso de fallo 60. La fase de descarga dispone de ~14,8 min (≈1,4× el máximo observado). PROVISIONAL:
    # recalibrar con data/_ingest/latest/actions__job_daily.json tras 2 semanas.
    # FAMILIAS-01 M1: sombra CRD +40 s. Reserva 740 → 780 y timeout 30 → 31 min para que la fase de
    # descarga no quede más corta que antes (el tope del job es en minutos enteros).
    env:
      G8_JOB: daily
      G8_JOB_RESERVE_S: '780'
      # R2-1: cada paso g8step copia data/ antes de ejecutarse y, al terminar, restaura al último válido lo que
      # quede vacío, ilegible, retrocedido o escrito por un paso cortado → «git add data/» solo ve salidas válidas.
      G8_STEP_GUARD: data
      G8_GUARD_SKIP: options,futures

    steps:
      # ── 0. Plazo global: todo paso de descarga termina antes de DEADLINE − RESERVE ──
      - name: Plazo global del job (G8_JOB_DEADLINE_EPOCH)
        run: |
          echo "G8_JOB_DEADLINE_EPOCH=$(( $(date +%s) + 31*60 - 90 ))" >> "$GITHUB_ENV"
          echo "G8_STEP_LOG=$RUNNER_TEMP/g8_steps.jsonl" >> "$GITHUB_ENV"

      # ── 1. Checkout repository ─────────────────────────────────────────────
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main       # acta P-11: tip of main when the job starts, not the SHA frozen while queued
          fetch-depth: 0  # Full history needed for rebase

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        timeout-minutes: 4
        run: pip install -r requirements.txt

      # PR-A: filas 1, 4-8, 11 y 12 antes de los scripts. El token solo vive en este paso.
      - name: Private data pull
        timeout-minutes: 5
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_READ_CI }}
        run: |
          set -euo pipefail
          python3 scripts/tools/private_data.py pull "$RUNNER_TEMP/g8data" --rows 1,4,5,6,7,8,11,12

      # ── 4. Run scrapers — TOLERANT mode (each independent) ────────────────
      - name: Fetch SOFR (USD anchor)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name sofr --cap 240 -- python scripts/fetch_sofr.py
        continue-on-error: true
        id: sofr

      - name: Fetch ESTR (EUR RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name estr --cap 240 -- python scripts/fetch_estr.py
        continue-on-error: true
        id: estr

      - name: Fetch SONIA (GBP RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name sonia --cap 240 -- python scripts/fetch_sonia.py
        continue-on-error: true
        id: sonia

      - name: Fetch AONIA (AUD RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name aonia --cap 240 -- python scripts/fetch_aonia.py
        continue-on-error: true
        id: aonia

      - name: Fetch TONA (JPY RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name tona --cap 240 -- python scripts/fetch_tona.py
        continue-on-error: true
        id: tona

      - name: Fetch CORRA (CAD RFR)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name corra --cap 240 -- python scripts/fetch_corra.py
        continue-on-error: true
        id: corra

      - name: Fetch NZD OCR via BIS (NZD reference)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_ocr --cap 240 -- python scripts/fetch_bis_ocr.py
        continue-on-error: true
        id: ocr

      - name: Fetch BoE Bank Rate via BIS (GBP policy)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_gb --cap 240 -- python scripts/fetch_bis_policy.py GB
        continue-on-error: true
        id: gb_policy

      - name: Fetch BoJ Policy Rate via BIS (JPY policy)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_jp --cap 240 -- python scripts/fetch_bis_policy.py JP
        continue-on-error: true
        id: jp_policy

      - name: Fetch SNB Policy Rate via BIS (CHF policy)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_ch --cap 240 -- python scripts/fetch_bis_policy.py CH
        continue-on-error: true
        id: ch_policy

      - name: Fetch RBA Cash Rate via BIS (AUD policy)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name bis_au --cap 240 -- python scripts/fetch_bis_policy.py AU
        continue-on-error: true
        id: au_policy

      - name: Fetch US Bills (3M/6M/1Y/2Y)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name us_bills --cap 240 -- python scripts/fetch_us_bills.py
        continue-on-error: true
        id: us_bills

      - name: Fetch CAD Bills (3M/6M/1Y)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name cad_bills --cap 240 -- python scripts/fetch_cad_bills.py
        continue-on-error: true
        id: cad_bills

      - name: Fetch AUD Bills (1M/3M/6M)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name aud_bills --cap 240 -- python scripts/fetch_aud_bills.py
        continue-on-error: true
        id: aud_bills

      - name: Fetch EUR AAA Curve (3M/6M/1Y/2Y/5Y/10Y)
        timeout-minutes: 9
        run: python scripts/tools/g8step.py --name eur_bills --cap 420 -- python scripts/fetch_eur_bills.py
        continue-on-error: true
        id: eur_bills

      - name: Fetch GBP Gilt Curve (6M/1Y/2Y/5Y/10Y)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name gbp_bills --cap 240 -- python scripts/fetch_gbp_bills.py
        continue-on-error: true
        id: gbp_bills

      - name: Fetch JPY JGB Curve (1Y/2Y/3Y/5Y/10Y/20Y)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name jpy_bills --cap 240 -- python scripts/fetch_jpy_bills.py
        continue-on-error: true
        id: jpy_bills

      # ── NZD scraper deferred pending RBNZ response (2026-06-09) ───────────
      # RBNZ (B2) and the SNB data portal reject datacenter IPs / non-browser TLS.
      # Both are fetched on the operator's Mac (launchd 08:00: fetch_nzd_b2.py +
      # fetch_chf_snb.py → push_nzd_to_github.py via the GitHub API) and consumed
      # here as repo CSVs (NZD_*.csv, CHF_*.csv). Never call those endpoints from Actions.

      - name: Fetch Floor References (IORB/DFR/BoC Target)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name floors --cap 240 -- python scripts/fetch_floor_spreads.py
        continue-on-error: true
        id: floors
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Fetch ACM 10Y Term Premium (NY Fed)
        timeout-minutes: 6
        run: python scripts/tools/g8step.py --name acm_tp --cap 240 -- python scripts/fetch_acm.py
        continue-on-error: true
        id: acm

      # ── 5. Status summary ──────────────────────────────────────────────────
      - name: Report scraper results
        if: always()
        run: |
          echo "## Scraper Results — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scraper | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SOFR       | ${{ steps.sofr.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESTR       | ${{ steps.estr.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SONIA      | ${{ steps.sonia.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AONIA      | ${{ steps.aonia.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TONA       | ${{ steps.tona.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CORRA      | ${{ steps.corra.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NZD OCR    | ${{ steps.ocr.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BoE Bank Rate (GB)  | ${{ steps.gb_policy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BoJ Policy Rate (JP)| ${{ steps.jp_policy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SNB Policy Rate (CH)| ${{ steps.ch_policy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RBA Cash Rate (AU)  | ${{ steps.au_policy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| US Bills   | ${{ steps.us_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CAD Bills  | ${{ steps.cad_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AUD Bills  | ${{ steps.aud_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EUR Bills  | ${{ steps.eur_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GBP Bills  | ${{ steps.gbp_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JPY Bills  | ${{ steps.jpy_bills.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ACM TP 10Y | ${{ steps.acm.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Floor refs (IORB/DFR/BoC) | ${{ steps.floors.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** CHF bills updated manually via convert_chf_bills.py" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** NZD bills + bonds deferred pending RBNZ response (manual quincenal in the meantime)" >> $GITHUB_STEP_SUMMARY

      # ── 5b. Long-end attribution layer (ACM decomposition + real yields) ──
      - name: ACM G8 decomposition (USD EUR JPY GBP CAD AUD)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        timeout-minutes: 13
        run: python scripts/tools/g8step.py --name acm_g8 --cap 660 -- python scripts/acm_g8.py USD EUR JPY GBP CAD AUD

      # ── 5b-bis. NZD real ACM (K=3 on RBNZ B2 1985+ spliced by the Mac fetch v1.4).
      #    Refuses (exit 1, tolerated) while the history splice hasn't landed; the next
      #    step then writes the AUD-anchored proxy (nzd_tp_synth.py v1.1 = fallback only) ──
      - name: NZD ACM decomposition (real, B2 history)
        continue-on-error: true
        timeout-minutes: 7
        run: python scripts/tools/g8step.py --name acm_nzd --cap 300 -- python scripts/acm_g8.py NZD || echo "acm NZD not available yet — proxy fallback follows"

      # ── 5b-ter. CHF real ACM (K=3 on the SNB zero curve 1988+, CHF_SPOT_*.csv from the Mac
      #    fetch_chf_snb.py). Fails (tolerated) until those files land; the frozen 2025-07
      #    ACM_G8_CHF.csv then stays in place, flagged FROZEN by the dashboard ──
      - name: CHF ACM decomposition (real, SNB curve)
        continue-on-error: true
        timeout-minutes: 7
        run: python scripts/tools/g8step.py --name acm_chf --cap 300 -- python scripts/acm_g8.py CHF || echo "acm CHF not available yet — frozen file stays"

      - name: NZD TP synth fallback (ACM_G8_NZD.csv only if no fresh real ACM)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/tools/g8step.py --name nzd_tp_synth --cap 120 -- python scripts/nzd_tp_synth.py

      - name: Real yields G8 (USD GBP CAD AUD + NZD when IIB files exist)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        timeout-minutes: 7
        run: python scripts/tools/g8step.py --name real_yields --cap 300 -- python scripts/real_yields_g8.py

      - name: Fetch EUR Real 10Y (Bundesbank DE linkers)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/tools/g8step.py --name eur_real --cap 180 -- python scripts/fetch_eur_real.py

      - name: Fetch JPY Real 10Y (JGBi on-the-run, JSDA)
        continue-on-error: true
        env:
          JSDA_BASE: ${{ vars.JSDA_BASE }}
        timeout-minutes: 5
        run: python scripts/tools/g8step.py --name jpy_real --cap 180 -- python scripts/fetch_jpy_real.py

      # ── P-10: IPC suizo oficial (BFS, mensual) → real ex post CHF en §01/§00 (Suiza no emite bonos indexados)
      - name: Fetch CHF CPI y/y (BFS · acta P-10)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/tools/g8step.py --name chf_cpi --cap 120 -- python scripts/fetch_chf_cpi.py

      # ── P-8: estimación diaria AUD 2Y/10Y entre publicaciones semanales de la RBA (EST_AUD_V1). Solo lee el repo
      # (AUD_NOM_2Y, RY_G8_AUD, AUD_BILL_6M, US_BILL_2Y, RY_G8_USD) → después de todos ellos y antes de s01b y del brief.
      - name: AUD nowcast (EST_AUD_V1 · acta P-8)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/tools/g8step.py --name aud_nowcast --cap 60 -- python scripts/aud_nowcast.py

      # ── 5c. Dashboard alerts (Telegram, one message/day only on change) ───
      # v1.0 2026-09-12: reads repo data only (no downloads, $0). State lives in
      # data/alerts/state.json and is committed by the step below (git add data/).
      # ── §01-b · lectura 22 s. + CTF (CONTEXT) — después de los ACM, antes de las alertas
      # E2: this --final run is the ONLY evaluation of the session (log + snap + state + events, write-once).
      # The midday runs in usd_factor.yml publish a PROVISIONAL S01B.json and write nothing else.
      # ── Fin de la fase de descarga: registro de pasos (omitidos/cortados por tiempo → ingest_watch avisa) ──
      - name: Registro de plazos de la fase de descarga
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/tools/g8step.py --ledger daily

      - name: S01B (22-session reading + CTF — the one evaluation per session, after acm_g8)
        if: always()
        timeout-minutes: 3
        run: python scripts/tools/g8step.py --name s01b_final --phase post --cap 120 --min 5 -- python scripts/tools/finalize_session.py
      - name: Dashboard alerts (Telegram on change)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        timeout-minutes: 2
        run: |
          set +e
          python scripts/tools/g8step.py --name dashboard_alerts --phase post --cap 60 --min 5 -- python scripts/dashboard_alerts.py > "$RUNNER_TEMP/dashboard-alerts.log" 2>&1
          rc=$?
          set -e
          rows=$(wc -l < "$RUNNER_TEMP/dashboard-alerts.log" | tr -d ' ')
          echo "dashboard_alerts rc=${rc} rows=${rows}"
          exit "$rc"

      # ── Lote 1 (2026-09-24): latido del Mac y credenciales — aviso independiente del Mac ──
      - name: Ingest watch (latido del Mac + credenciales)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        timeout-minutes: 3
        run: python scripts/tools/g8step.py --name ingest_watch --phase post --cap 90 --min 5 -- python scripts/ingest_watch.py --result "$RUNNER_TEMP/ingest_watch.json"

      # U1: la web pinta estas sombras. cme_options.yml sigue congelado; este job solo las regenera.
      - name: Shadow CB_EVENT_48H
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/tools/g8step.py --name cb_event_shadow --phase post --cap 40 --min 5 -- python scripts/cb_event_shadow.py

      - name: Shadow CME options C2
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set +e
          start=$(date +%s)
          python scripts/tools/g8step.py --name cme_options_shadow --phase post --cap 40 --min 5 -- python scripts/cme_options_shadow.py > "$RUNNER_TEMP/cme.log" 2>&1
          rc=$?
          set -e
          dur=$(( $(date +%s) - start ))
          rows=$(wc -l < "$RUNNER_TEMP/cme.log" | tr -d ' ')
          echo "cme_options_shadow rc=${rc} duration=${dur}s rows=${rows}"
          exit "$rc"

      - name: Shadow CME FXVOL (IV30 / RR25 / BF25 / OI futuros)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set +e
          start=$(date +%s)
          python scripts/tools/g8step.py --name cme_fxvol_shadow --phase post --cap 40 --min 5 -- python scripts/cme_fxvol_shadow.py > "$RUNNER_TEMP/cme.log" 2>&1
          rc=$?
          set -e
          dur=$(( $(date +%s) - start ))
          rows=$(wc -l < "$RUNNER_TEMP/cme.log" | tr -d ' ')
          echo "cme_fxvol_shadow rc=${rc} duration=${dur}s rows=${rows}"
          exit "$rc"

      # t296u: el paso FXVOL corre después del registro de plazos y de ingest_watch, y con
      # continue-on-error un rc≠0 (TIMEOUT 124 incluido) no se veía. Su resultado va a su propio
      # registro (data/_ingest/latest/actions__job_daily_fxvol.json), que ingest_watch lee en su
      # siguiente pasada: FAILED → aviso de paso fallido; TIMEOUT/SKIPPED → aviso de plazo.
      - name: Registro del paso FXVOL (alarma ingest_watch)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/tools/g8step.py --ledger daily_fxvol --only cme_fxvol_shadow

      - name: Shadow CHF nowcast
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/tools/g8step.py --name chf_nowcast_shadow --phase post --cap 40 --min 5 -- python scripts/chf_nowcast_shadow.py

      # U2: diagnóstico A3 de §01-b en SHADOW. No toca s01b.py ni su salida; ~15 s medidos.
      - name: Shadow S01B A3
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/tools/g8step.py --name s01b_shadow_a3 --phase post --cap 40 --min 5 -- python scripts/s01b_shadow_a3.py

      # FAMILIAS-01 M1. Sombra: continue-on-error. Con CRD_PUBLISH=False no escribe data/credit/.
      - name: Shadow CRD FRED (FAMILIAS-01 M1)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/tools/g8step.py --name credit_fred_shadow --phase post --cap 40 --min 5 -- python scripts/credit_fred_shadow.py

      # t297u (a): las cinco sombras posteriores al registro de plazos, con la misma alarma que FXVOL.
      # Su resultado va a data/_ingest/latest/actions__job_daily_shadows.json, que ingest_watch lee en su
      # siguiente pasada: FAILED → aviso de paso fallido; TIMEOUT/SKIPPED → aviso de plazo; sin línea → FAILED.
      - name: Registro de las sombras posteriores (alarma ingest_watch)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/tools/g8step.py --ledger daily_shadows --only cb_event_shadow --only cme_options_shadow --only chf_nowcast_shadow --only s01b_shadow_a3 --only credit_fred_shadow

      # t297u (c): Dashboard alerts corre después del registro de plazos y con continue-on-error; su rc va a
      # data/_ingest/latest/actions__job_daily_dashboard.json, que ingest_watch lee en su siguiente pasada.
      - name: Registro de Dashboard alerts (alarma ingest_watch)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/tools/g8step.py --ledger daily_dashboard --only dashboard_alerts

      # ── 6. Commit CSVs with pull-rebase retry pattern ─────────────────────
      # Fix v2026-06-08: handles concurrent pushes (manual re-runs, rename
      # events, parallel cron). Retries up to 5 times with exponential backoff.
      - name: Commit updated data files
        if: always()
        timeout-minutes: 3
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TZ=UTC python scripts/argos_rates.py
          mkdir -p "$RUNNER_TEMP/alerts-full"
          for f in brief.json state.json; do
            if [ -f "data/alerts/private/$f" ]; then
              cp -a "data/alerts/private/$f" "$RUNNER_TEMP/alerts-full/$f"
            elif [ -f "data/alerts/$f" ]; then
              cp -a "data/alerts/$f" "$RUNNER_TEMP/alerts-full/$f"
            fi
          done
          python3 - << 'PY'
          import json, os
          for rel in ("data/alerts/brief.json", "data/alerts/state.json"):
              if not os.path.isfile(rel):
                  continue
              with open(rel, encoding="utf-8") as fh:
                  doc = json.load(fh)
              if isinstance(doc, dict) and "walls" in doc:
                  doc.pop("walls")
                  tmp = rel + ".tmp"
                  with open(tmp, "w", encoding="utf-8") as fh:
                      json.dump(doc, fh, indent=1, ensure_ascii=False)
                  os.replace(tmp, rel)
          PY
          mkdir -p data/public
          python3 scripts/tools/cme_public_projection.py \
            --out data/public/CME_OPTIONS_SURFACE_public.json data/OPTIONS_SURFACE.json \
            --out data/public/CME_C1_public.json data/CME_OPTIONS_C1_shadow.json \
            --out data/public/CME_FXVOL_public.json data/CME_FXVOL_shadow.json
          git add data/ \
            data/CB_EVENT_48H_shadow.json \
            data/CHF_NOWCAST_shadow.json \
            data/CHF_SPOT_2Y_daily_shadow.csv \
            data/CHF_SPOT_5Y_daily_shadow.csv \
            data/S01B_shadow_a3.json
          # t248u: CME público solo bajo data/public/. Los tres nombres con cifras
          # siguen en .gitignore y este paso no los añade.
          # data/CME_OPTIONS_C1_shadow.json
          # data/options/shadow_history.json
          # data/CME_FXVOL_shadow.json
          # data/options/fxvol_history.csv

          if git diff --staged --quiet; then
            echo "No data changes detected — skipping commit"
            exit 0
          fi

          CHANGED=$(git diff --staged --name-only | wc -l)
          git commit -m "chore: daily data update $(date -u '+%Y-%m-%d') [${CHANGED} files]"
          bash scripts/tools/git_push_retry.sh 5   # acta P-11 (helper P-7): on 6-oct the old loop hit a rebase conflict and lost the run

      # PR-A: filas 4, 5, 7 y 8 más brief/state completos. El crédito solo si el fichero existe.
      - name: Private data push
        if: always()
        timeout-minutes: 5
        env:
          G8_DATA_TOKEN: ${{ secrets.G8_DATA_WRITE }}
        run: |
          set -euo pipefail
          for f in brief.json state.json; do
            src="$RUNNER_TEMP/alerts-full/$f"
            if [ -f "$src" ]; then cp -a "$src" "data/alerts/$f"; fi
          done
          log="$RUNNER_TEMP/dashboard-alerts.log"
          clone="$RUNNER_TEMP/g8data"
          if [ -f "$log" ] && [ -d "$clone/.git" ]; then
            mkdir -p "$clone/data/alerts"
            cp "$log" "$clone/data/alerts/daily_update_alerts.log"
            git -C "$clone" add -- data/alerts/daily_update_alerts.log
            if ! git -C "$clone" diff --cached --quiet; then
              git -C "$clone" -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "data: daily_update alerts log [skip netlify]"
            fi
          fi
          python3 scripts/tools/private_data.py push "$RUNNER_TEMP/g8data" \
            --paths data/options/shadow_history.json data/options/fxvol_history.csv \
              data/CME_OPTIONS_C1_shadow.json data/CME_FXVOL_shadow.json \
              data/alerts/brief.json data/alerts/state.json \
            --credit-if-present \
            --workflow "daily_update" --session "$(date -u +%F)"

      - name: Private data verify
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set +e
          python3 scripts/tools/private_data.py verify "$RUNNER_TEMP/g8data" \
            --paths data/options/shadow_history.json data/options/fxvol_history.csv \
              data/CME_OPTIONS_C1_shadow.json data/CME_FXVOL_shadow.json \
              data/alerts/brief.json data/alerts/state.json \
            --credit-if-present
          rc=$?
          echo "private_data verify rc=${rc}"
          # t297u (b): rc≠0 (differ>0 o fallo) queda en data/_ingest/latest/actions__job_verify_daily.json,
          # que lee ingest_watch. Se sube aparte (worktree, [skip netlify]); el paso sigue sin tumbar el job.
          python3 scripts/tools/step_alarm.py record private_verify_daily "$rc" --detail "private_data verify rc=${rc}"
          python3 scripts/tools/step_alarm.py publish verify_daily --only private_verify_daily --commit
          exit "$rc"

      - name: Telegram de ingest_watch no entregado → job en rojo (GitHub envía email)
        if: always()
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import json, os, sys
          p = os.path.join(os.environ["RUNNER_TEMP"], "ingest_watch.json")
          d = json.load(open(p)) if os.path.exists(p) else {"delivery": "NO_RESULT"}
          print("ingest_watch entrega:", d.get("delivery"))
          sys.exit(0 if d.get("delivery") in ("SENT", "DRY", "NOTHING") else 1)
          PY

      # ── Ley 2 (fallos ruidosos): cualquier paso rojo → Telegram, no solo email ──
      - name: Alert on failure
        if: failure()
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --fail "workflow=daily run=${{ github.run_number }} — ver Actions"
