# .github/workflows/validate.yml — CI de humo (auditoría institucional 2026-09-13)
# Corre en cada push/PR que toque código o datos de configuración. Detecta en 1 minuto lo que
# antes solo salía a las 18:00 UTC por Telegram: sintaxis rota en scripts/, YAML de workflows
# inválido, JS inline de docs/index.html o docs/js/*.js con errores de sintaxis, registry
# malformado, y que dashboard_alerts.py construya el brief en --dry-run sin excepciones.
# No toca datos ni envía nada (sin secrets). Ley 2: un fallo aquí es ruidoso (check rojo).
name: Validate (smoke)

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'sources/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'data/manual/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml

      # Acta P-6: las comprobaciones viven en scripts/tools/validate_smoke.sh (las comparte la compuerta del agente).
      # E1 (2026-09-21) / E2 (2026-09-22): la equivalencia s01b sobre las sesiones congeladas sigue incluida.
      - name: Smoke checks (syntax · tests · s01b equivalence · YAML · registry · JS · brief dry-run · imports)
        run: bash scripts/tools/validate_smoke.sh

      # SALUD-TESTS-01: la suite en rojo en main avisa por Telegram (Ley 2, fallos ruidosos)
      - name: Alert on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --fail "workflow=validate run=${{ github.run_number }} — suite de tests en rojo en main, ver Actions"
